const CONFIG={lotofacil:{name:'Lotofácil',api:'lotofacil',total:25},megasena:{name:'Mega-Sena',api:'megasena',total:60},quina:{name:'Quina',api:'quina',total:80},lotomania:{name:'Lotomania',api:'lotomania',total:100,zero:true},diadesorte:{name:'Dia de Sorte',api:'diadesorte',total:31},duplasena:{name:'Dupla Sena',api:'duplasena',total:50},timemania:{name:'Timemania',api:'timemania',total:80},supersete:{name:'Super Sete',api:'supersete',total:70,special:true},maismilionaria:{name:'+Milionária',api:'maismilionaria',total:50}};
let lot='lotofacil',mode='colors',scale=1,rows=60,start=3770,extraBlank=60;const data={lotofacil:{...HIST}};const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const select=$('lottery');Object.entries(CONFIG).forEach(([key,c])=>{const o=document.createElement('option');o.value=key;o.textContent=c.name;select.append(o)});
function color(n){const k=n%10;return ['white','red','yellow','green2','brown','blue','purple','black','gray','gold'][k]}
function dims(){const total=CONFIG[lot].total;const avail=Math.max(1,window.innerWidth);const base=lot==='lotofacil'?(avail-56)/25:Math.max(14,(avail-56)/25);const cell=Math.max(7,base*scale),edge=28*scale;return {cell,edge,total}}
function render(){const cfg=CONFIG[lot],{cell,edge,total}=dims();const viewport=$('viewport'),oldTop=viewport.scrollTop;const grid=document.createElement('div');grid.className='grid';grid.style.setProperty('--cell',cell+'px');grid.style.setProperty('--edge',edge+'px');grid.style.setProperty('--total',total);grid.style.setProperty('--font',Math.max(5.5,Math.min(12,cell*.37))+'px');grid.style.setProperty('--edgefont',Math.max(6,Math.min(10,edge*.29))+'px');const frag=document.createDocumentFragment();const table=data[lot]||{};
const real=Object.keys(table).map(Number).filter(n=>Number.isInteger(n)).sort((a,b)=>a-b);

const last=real.length?real[real.length-1]:0;
const contests=Array.from({length:Math.max(0,last-first+1)+extraBlank},(_,i)=>first+i);
for(const contest of contests){const nums=table[contest];const edgeRed=contest%10===0;let left=document.createElement('div');left.className='edge'+(edgeRed?' red':'');left.textContent=(mode==='green'?'C':'')+contest;frag.append(left);const set=nums?new Set(nums):null;for(let n=1;n<=total;n++){const cellEl=document.createElement('div');const hit=set?.has(n)??false;cellEl.className='cell '+(mode==='green'?(hit?'green':'white'):(hit?color(n):'empty'));cellEl.textContent=nums&&(mode==='green'||hit)?(cfg.zero&&n===100?'00':pad(n)):'';frag.append(cellEl)}let right=document.createElement('div');right.className='edge'+(edgeRed?' red':'');right.textContent=(mode==='green'?'C':'')+contest;frag.append(right)}grid.append(frag);$('sheet').replaceChildren(grid);viewport.scrollTop=oldTop;$('status').textContent=cfg.name+' • último resultado carregado: '+(last||'nenhum')+' • zoom '+Math.round(scale*100)+'%';}

function parseResult(obj){const n=Number(obj.numero??obj.concurso??obj.numeroConcurso);let ds=obj.listaDezenas??obj.dezenas??obj.resultado??[];if(typeof ds==='string')ds=ds.split(/[^0-9]+/).filter(Boolean);if(!Array.isArray(ds))ds=[];if(lot==='supersete'&&Array.isArray(obj.dezenas))ds=obj.dezenas.map((x,i)=>i*10+Number(x)+1);const values=ds.map(Number).filter(v=>Number.isInteger(v)).map(v=>CONFIG[lot].zero&&v===0?100:v).filter(v=>v>=1&&v<=CONFIG[lot].total);return {n,values}}

async function requestContest(key,number){
 const api=CONFIG[key].api;
 const urls=[`https://servicebus2.caixa.gov.br/portaldeloterias/api/${api}${number?'/'+number:''}`,
 `https://loteriascaixa-api.herokuapp.com/api/${api}/${number||'latest'}`];
 for(const url of urls){try{
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8500);

function extractResult(key,obj){
 const n=Number(obj.numero??obj.concurso??obj.numeroConcurso);
 let ds=obj.listaDezenas??obj.dezenas??obj.resultado??[];
 if(key==='supersete'){
  let cols=obj.listaDezenas??obj.dezenas??[];

 }

 if(!Number.isInteger(n)||n<1||values.length<minimum)return null;

  let done=0,added=0,idx=0;

  }}}
  await Promise.all(Array.from({length:Math.min(6,targets.length)},()=>worker()));
  saveLottery(key);

 }finally{loading=false;}

// Exporta a tabela selecionada com dois concursos futuros em branco após o último resultado.
function baixarTabela(){
 const cfg=CONFIG[lot],table=data[lot]||{};
 const ids=Object.keys(table).map(Number).filter(Number.isInteger).sort((a,b)=>a-b);
 if(!ids.length){alert('Ainda não há resultados carregados para baixar.');return;}
 const visible=ids.filter(n=>n>=Math.max(ids[0],ids[ids.length-1]-59));
 const unit=32,edge=75,rowH=30,w=edge*2+cfg.total*unit,h=52+(visible.length+2)*rowH;
 const canvas=document.createElement('canvas');canvas.width=w*2;canvas.height=h*2;
 const ctx=canvas.getContext('2d');ctx.scale(2,2);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#064221';ctx.fillRect(0,0,w,52);
 ctx.fillStyle='#ffe16d';ctx.font='bold 19px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(cfg.name+' — '+(mode==='green'?'Tabela verde':'Tabela de cores'),w/2,26);
 const colors={red:'#f50000',yellow:'#ffff00',green2:'#00a45c',brown:'#af571c',blue:'#00a6df',purple:'#c800e5',black:'#050505',gray:'#9a9a9a',gold:'#ffbf16',white:'#f4f4f4'};
 const exportRows=[...visible,ids[ids.length-1]+1,ids[ids.length-1]+2];
 exportRows.forEach((contest,i)=>{
  const y=52+i*rowH,isFuture=i>=visible.length,hit=new Set(isFuture?[]:(table[contest]||[])),red=contest%10===0;
  for(let col=-1;col<=cfg.total;col++){
   const x=col===-1?0:col===cfg.total?edge+cfg.total*unit:edge+col*unit;
   const cw=(col===-1||col===cfg.total)?edge:unit;
   const n=col+1,isEdge=col===-1||col===cfg.total,active=hit.has(n);
   let bg=isEdge?(red?'#f00000':'#ffffff'):mode==='green'?(active?'#2c9445':'#f4f4f4'):(active?colors[color(n)]:'#f2f2f2');
   ctx.fillStyle=bg;ctx.fillRect(x,y,cw,rowH);
   ctx.strokeStyle='#555';ctx.lineWidth=.7;ctx.strokeRect(x+.35,y+.35,cw-.7,rowH-.7);
   let value=isEdge?(mode==='green'?'C':'')+contest:(!isFuture&&(mode==='green'||active))?(cfg.zero&&n===100?'00':pad(n)):'';
   if(value){ctx.fillStyle=active&&mode==='colors'&&['red','green2','brown','purple','black'].includes(color(n))?'#fff':'#111';ctx.font=(mode==='green'?'bold ':'600 ')+(isEdge?'15px':'14px')+' Arial';ctx.fillText(value,x+cw/2,y+rowH/2)}
  }
 });
 const nomeArquivo='Tabela_'+cfg.name.replace(/[^a-z0-9]/gi,'_')+'_'+(mode==='green'?'Verde':'Cores')+'.png';
 const salvarArquivo=blob=>{
  if(!blob){alert('Não foi possível gerar a imagem.');return;}
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');link.href=url;link.download=nomeArquivo;link.rel='noopener';
  document.body.appendChild(link);link.click();link.remove();
  $('status').textContent='Download solicitado: '+nomeArquivo;
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 };
 const compartilharOuBaixar=blob=>{
  if(!blob){alert('Não foi possível gerar a imagem.');return;}
  if(navigator.share&&navigator.canShare&&typeof File==='function'){
   try{
    const arquivo=new File([blob],nomeArquivo,{type:'image/png'});
    if(navigator.canShare({files:[arquivo]})){
     navigator.share({files:[arquivo],title:'Tabela de movimentação de cores'}).then(()=>{
      $('status').textContent='Imagem pronta para salvar';
     }).catch(erro=>{
      if(erro&&erro.name==='AbortError')return;
      salvarArquivo(blob);
     });
     return;
    }
   }catch(_){}
  }
  salvarArquivo(blob);
 };
 if(typeof canvas.toBlob==='function')canvas.toBlob(compartilharOuBaixar,'image/png');
 else{
  try{
   const data=canvas.toDataURL('image/png'),raw=atob(data.split(',')[1]),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   compartilharOuBaixar(new Blob([bytes],{type:'image/png'}));
  }catch(_){alert('Não foi possível gerar a imagem.');}
 }
}
$('download').onclick=baixarTabela;
$('viewport').addEventListener('scroll',()=>{const v=$('viewport');if(v.scrollTop+v.clientHeight>v.scrollHeight-400){const top=v.scrollTop;extraBlank+=80;render();v.scrollTop=top;}});resetRange();setTimeout(()=>{if(!loading)refresh()},700);window.addEventListener('resize',render);setInterval(()=>{if(!document.hidden&&!loading)refresh()},300000);
</script></body></html>
