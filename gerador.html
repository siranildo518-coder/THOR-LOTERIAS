<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>Gerador de Palpites - THOR LOTERIAS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07101f;color:#fff;font-family:Arial,sans-serif}.head{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b1b2d;border-bottom:1px solid #38536d;position:sticky;top:0;z-index:5}.back{width:42px;height:36px;border:1px solid #66839d;border-radius:7px;background:#263c52;color:#fff;font-size:21px}.body{max-width:620px;margin:auto;padding:16px}.card{background:#101d2d;border:1px solid #38536d;border-radius:12px;padding:14px}.label{display:block;font-size:12px;font-weight:800;color:#cfe5f7;margin:0 0 6px}.field{width:100%;height:44px;background:#071522;border:1px solid #58738d;border-radius:8px;color:#fff;padding:0 10px;font-size:15px;margin-bottom:13px}.go{width:100%;height:46px;border:1px solid #82ffc0;border-radius:8px;background:linear-gradient(#29bd78,#087f4c);box-shadow:inset 0 2px 2px rgba(255,255,255,.3),0 3px 0 #045d37;color:#fff;font-weight:900;font-size:15px}.status{text-align:center;color:#bed3e5;font-size:12px;margin:14px 0}.game{border:1px solid #38536d;background:#0b1725;border-radius:9px;padding:10px;margin:8px 0}.line{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px}.pct{color:#7dffb8;font-size:15px;min-width:42px}.balls{display:flex;flex-wrap:wrap;gap:5px}.ball{width:29px;height:29px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(#9b48df,#5d168f);border:1px solid #d9a8ff;font-size:11px;font-weight:900}</style></head><body><div class="head"><button class="back" onclick="history.back()">←</button><strong>Gerador de Palpites</strong></div><main class="body"><div class="card"><label class="label">Loteria</label><select class="field" id="lot"><option value="lotofacil">Lotofácil</option><option value="megasena">Mega-Sena</option><option value="quina">Quina</option><option value="lotomania">Lotomania</option><option value="diadesorte">Dia de Sorte</option><option value="timemania">Timemania</option><option value="duplasena">Dupla Sena</option><option value="supersete">Super Sete</option></select><label class="label">Concursos para analisar (10 a 500)</label><input class="field" id="conc" type="number" min="10" max="500" value="50" inputmode="numeric"><button class="go" id="gerar">GERAR 30 JOGOS</button><div class="status" id="status">Escolha a loteria e a quantidade de concursos.</div></div><div id="out"></div></main><script>const cfg={lotofacil:{api:'lotofacil',max:25,qtd:15,min:1},megasena:{api:'megasena',max:60,qtd:6,min:1},quina:{api:'quina',max:80,qtd:5,min:1},lotomania:{api:'lotomania',max:99,qtd:50,min:0},diadesorte:{api:'diadesorte',max:31,qtd:7,min:1},timemania:{api:'timemania',max:80,qtd:10,min:1},duplasena:{api:'duplasena',max:50,qtd:6,min:1},supersete:{api:'supersete',max:9,qtd:7,min:0}};const $=x=>document.getElementById(x);async function api(tipo,n){let u='https://servicebus2.caixa.gov.br/portaldeloterias/api/'+tipo+(n?'/'+n:'');let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP');return r.json()}function dz(d){let a=d&&(d.listaDezenas||d.dezenas||d.numeros);return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}function pick(pool,score,qtd){let p=pool.slice(),j=[];while(j.length<qtd&&p.length){let total=p.reduce((s,x)=>s+(score[x]||.001),0),r=Math.random()*total,sel=p[0];for(let x of p){r-=score[x]||.001;if(r<=0){sel=x;break}}j.push(sel);p.splice(p.indexOf(sel),1)}return j.sort((a,b)=>a-b)}$('gerar').onclick=async()=>{let key=$('lot').value,c=cfg[key],n=Math.max(10,Math.min(500,parseInt($('conc').value)||50)),st=$('status'),out=$('out');st.textContent='Analisando '+n+' concursos...';out.innerHTML='';try{let ult=await api(c.api),numero=Number(ult.numero||ult.concurso),hist=[];for(let i=0;i<n&&numero-i>0;i++){try{let d=i?await api(c.api,numero-i):ult,a=dz(d);if(a.length)hist.push(a)}catch(e){}}if(!hist.length)throw Error('sem histórico');if(key==='supersete'){let col=Array.from({length:7},()=>Array(10).fill(0));hist.forEach(j=>j.slice(0,7).forEach((v,i)=>{if(v>=0&&v<=9)col[i][v]++}));let jogos=[],seen=new Set();while(jogos.length<30){let j=col.map((a,i)=>{let total=a.reduce((s,v)=>s+v+1,0),r=Math.random()*total;for(let d=0;d<10;d++){r-=a[d]+1;if(r<=0)return d}return 0}),k=j.join('');if(!seen.has(k)){seen.add(k);let raw=j.reduce((s,v,i)=>s+(col[i][v]+1)/(hist.length+10),0)/7;jogos.push({j,p:Math.max(1,Math.min(99,Math.round(raw*100)))})}}jogos.sort((a,b)=>b.p-a.p);render(jogos,key,hist.length);return}let size=c.max-c.min+1,freq=Array(c.max+1).fill(0),last=Array(c.max+1).fill(hist.length);hist.forEach((j,i)=>j.forEach(x=>{if(x>=c.min&&x<=c.max){freq[x]++;if(last[x]===hist.length)last[x]=i}}));let score=[];for(let x=c.min;x<=c.max;x++){let f=freq[x]/hist.length,r=1-Math.min(last[x],hist.length)/hist.length,a=Math.min(last[x]/Math.max(1,hist.length*.25),1);score[x]=.55*f+.25*r+.20*a+.03}let pool=Array.from({length:size},(_,i)=>i+c.min),jogos=[],seen=new Set(),tries=0,max=Math.max(...pool.map(x=>score[x]));while(jogos.length<30&&tries++<10000){let j=pick(pool,score,c.qtd),k=j.join('-');if(!seen.has(k)){seen.add(k);let raw=j.reduce((s,x)=>s+score[x],0)/j.length;jogos.push({j,p:Math.max(1,Math.min(99,Math.round(raw/max*100)))})}}jogos.sort((a,b)=>b.p-a.p);render(jogos,key,hist.length)}catch(e){st.textContent='Não foi possível carregar o histórico agora. Tente novamente.'}};function render(jogos,key,n){$('out').innerHTML=jogos.map((o,i)=>'<div class="game"><div class="line"><span class="pct">'+o.p+'%</span><span>Jogo '+String(i+1).padStart(2,'0')+'</span></div><div class="balls">'+o.j.map(x=>'<span class="ball">'+(key==='lotomania'?String(x).padStart(2,'0'):String(x).padStart(2,'0'))+'</span>').join('')+'</div></div>').join('');$('status').textContent=jogos.length+' jogos gerados com base em '+n+' concursos. Porcentagem = índice histórico, não chance de prêmio.'}</script></body></html>
