<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031426"><title>Gerador de Palpites</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#0d5790 0,#06365f 18%,#031b34 43%,#010b17 100%);color:#fff;font-family:Arial,sans-serif}.head{height:56px;display:flex;align-items:center;gap:12px;padding:0 10px;background:linear-gradient(180deg,#0e4b7c,#062a4c 55%,#021322);border-bottom:2px solid #ff9500}.head strong{font-size:20px;font-weight:900;font-style:italic}.head em{color:#ff9d16}.back{width:45px;height:38px;border:2px solid #ff9a00;border-radius:12px;background:linear-gradient(180deg,#123e67,#06182a);color:#ff9b22;font-size:25px}.body{max-width:620px;margin:auto;padding:10px}.filter{position:relative;margin:0 auto 9px;max-width:520px}.filterBtn,.choice{width:100%;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border:2px solid #ff9800;border-radius:15px;background:linear-gradient(180deg,#0e4675,#082c4d 45%,#031525);color:#fff;font-size:17px;font-weight:900}.filterBtn .arrow{margin-left:auto;color:#ffad22}.menu{display:none;position:absolute;z-index:20;left:0;right:0;top:51px;padding:5px;background:#041322;border:2px solid #ff8a00;border-radius:14px}.filter.open .menu{display:block}.opt{width:100%;height:42px;display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid #174c73;background:#092d4b;color:#fff;font-weight:800}.flower{font-size:24px}.choice{display:none;margin:0 auto 9px;max-width:520px}.choice.show{display:flex}.choice .radio{margin-left:auto}.controls{margin-top:8px;padding:10px 12px;background:#082640;border:1px solid #2089d0;border-radius:15px}.label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field{width:100%;height:44px;background:#0e3b61;border:2px solid #ff9a00;border-radius:10px;color:#fff;padding:0 13px;font-size:22px;font-weight:900}.go,.save{width:94%;margin:11px 3% 0;height:52px;border:2px solid #ff9a00;border-radius:18px;color:#fff;font-size:18px;font-weight:900;box-shadow:inset 0 3px 3px rgba(255,255,255,.45),inset 0 -5px 7px rgba(0,0,0,.45),0 3px 0 #884100}.go{background:linear-gradient(#3cff78,#12ce50 35%,#069432 67%,#035f20)}.save{display:none;background:linear-gradient(#36a9ff,#1476d4 45%,#07509e)}.status{font-size:12px;margin:11px 2% 0;padding:11px;background:#0b3559;border:1px solid #2089d0;border-radius:14px}.game{border:1px solid #ff8a00;background:#0b1725;border-radius:13px;padding:10px;margin:8px 0}.line{display:flex;gap:9px;font-size:13px;font-weight:800;margin-bottom:8px}.pct{color:#7dffb8}.balls{display:flex;flex-wrap:wrap;gap:5px}.ball{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#9b48df,#5d168f);border:1px solid #d9a8ff;font-size:11px;font-weight:900}</style></head><body><div class="head"><button class="back" id="voltarInicio">←</button><strong>Gerador de <em>Palpites</em></strong></div><main class="body"><div class="filter" id="filter"><button class="filterBtn" id="filterBtn"><span id="filterLabel">Escolha a Loteria</span><span class="arrow">▼</span></button><div class="menu" id="menu"></div></div><button class="choice" id="choice"><span class="flower">✤</span><span id="choiceName"></span><i class="radio"></i></button><div class="controls"><label class="label">Concursos para analisar (10 a 500)</label><input class="field" id="conc" type="number" min="10" max="500" value="50"><input id="lot" type="hidden"></div><button class="go" id="gerar">🎲 GERAR 30 JOGOS</button><button class="save" id="salvar">💾 SALVAR EM MEUS JOGOS</button><div class="status" id="status">ⓘ Escolha a loteria e a quantidade de concursos.</div><div id="out"></div></main><script>const cfg={lotofacil:{nome:'Lotofácil',api:'lotofacil',max:25,qtd:15,min:1},megasena:{nome:'Mega-Sena',api:'megasena',max:60,qtd:6,min:1},quina:{nome:'Quina',api:'quina',max:80,qtd:5,min:1},lotomania:{nome:'Lotomania',api:'lotomania',max:99,qtd:50,min:0},diadesorte:{nome:'Dia de Sorte',api:'diadesorte',max:31,qtd:7,min:1},timemania:{nome:'Timemania',api:'timemania',max:80,qtd:10,min:1},duplasena:{nome:'Dupla Sena',api:'duplasena',max:50,qtd:6,min:1},supersete:{nome:'Super Sete',api:'supersete',max:9,qtd:7,min:0}};const $=x=>document.getElementById(x),filter=$('filter'),menu=$('menu');let atuais=[];$('voltarInicio').onclick=()=>location.replace('./index.html?home=1&v=thor6');menu.innerHTML=Object.entries(cfg).map(([k,v])=>'<button class="opt" data-key="'+k+'"><span class="flower">✤</span>'+v.nome+'</button>').join('');$('filterBtn').onclick=()=>filter.classList.toggle('open');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let k=b.dataset.key;$('lot').value=k;$('choiceName').textContent=cfg[k].nome;$('choice').classList.add('show');filter.classList.remove('open');$('status').textContent=cfg[k].nome+' selecionada.'});$('choice').onclick=()=>filter.classList.add('open');async function api(t,n){let r=await fetch('https://servicebus2.caixa.gov.br/portaldeloterias/api/'+t+(n?'/'+n:''),{cache:'no-store'});if(!r.ok)throw Error();return r.json()}function dz(d){let a=d&&(d.listaDezenas||d.dezenas||d.numeros);return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}function pick(pool,score,q){let p=pool.slice(),j=[];while(j.length<q&&p.length){let total=p.reduce((s,x)=>s+(score[x]||.001),0),r=Math.random()*total,sel=p[0];for(let x of p){r-=score[x]||.001;if(r<=0){sel=x;break}}j.push(sel);p.splice(p.indexOf(sel),1)}return j.sort((a,b)=>a-b)}$('gerar').onclick=async()=>{let key=$('lot').value;if(!key){filter.classList.add('open');return}let c=cfg[key],n=Math.max(10,Math.min(500,parseInt($('conc').value)||50));$('status').textContent='Analisando '+n+' concursos...';$('out').innerHTML='';$('salvar').style.display='none';try{let ult=await api(c.api),numero=Number(ult.numero||ult.concurso),hist=[];for(let i=0;i<n&&numero-i>0;i++){try{let d=i?await api(c.api,numero-i):ult,a=dz(d);if(a.length)hist.push(a)}catch(e){}}if(!hist.length)throw Error();let freq=Array(c.max+1).fill(0);hist.forEach(j=>j.forEach(x=>{if(x>=c.min&&x<=c.max)freq[x]++}));let score=[];for(let x=c.min;x<=c.max;x++)score[x]=freq[x]/hist.length+.03;let pool=Array.from({length:c.max-c.min+1},(_,i)=>i+c.min),max=Math.max(...pool.map(x=>score[x])),jogos=[],seen=new Set(),tries=0;if(key==='supersete'){while(jogos.length<30){let j=Array.from({length:7},()=>Math.floor(Math.random()*10)),k=j.join('');if(!seen.has(k)){seen.add(k);jogos.push({j,p:50})}}}else while(jogos.length<30&&tries++<10000){let j=pick(pool,score,c.qtd),k=j.join('-');if(!seen.has(k)){seen.add(k);jogos.push({j,p:Math.max(1,Math.min(99,Math.round(j.reduce((s,x)=>s+score[x],0)/j.length/max*100)))})}}render(jogos,key,hist.length)}catch(e){$('status').textContent='Não foi possível carregar o histórico agora. Tente novamente.'}};function cards(jogos){return jogos.map((o,i)=>'<div class="game"><div class="line"><span class="pct">'+o.p+'%</span><span>Jogo '+String(i+1).padStart(2,'0')+'</span></div><div class="balls">'+o.j.map(x=>'<span class="ball">'+String(x).padStart(2,'0')+'</span>').join('')+'</div></div>').join('')}function render(jogos,key,n){jogos.sort((a,b)=>b.p-a.p);atuais={key,jogos,n};$('out').innerHTML=cards(jogos);$('salvar').style.display='block';$('status').textContent=jogos.length+' jogos gerados com base em '+n+' concursos.'}$('salvar').onclick=()=>{if(!atuais.jogos)return;let banco=JSON.parse(localStorage.getItem('thorMeusJogos')||'{}');if(!banco||Array.isArray(banco))banco={};if(!Array.isArray(banco[atuais.key]))banco[atuais.key]=[];let agora=new Date().toISOString();atuais.jogos.forEach((o,i)=>banco[atuais.key].unshift({data:agora,loteria:atuais.key,nome:cfg[atuais.key].nome,numeros:o.j,dezenas:o.j,jogo:o.j,percentual:o.p,probabilidade:o.p,concursos:atuais.n,origem:'Gerador de Palpites',indice:i+1}));banco[atuais.key]=banco[atuais.key].slice(0,300);localStorage.setItem('thorMeusJogos',JSON.stringify(banco));localStorage.setItem('thorJogosSalvos',JSON.stringify(banco));localStorage.setItem('thorPalpitesMeusJogos',JSON.stringify(banco));localStorage.removeItem('thorPalpitesSalvos');$('status').textContent='✓ '+atuais.jogos.length+' jogos enviados para Meus Jogos - '+cfg[atuais.key].nome+'.';};</script></body></html>
