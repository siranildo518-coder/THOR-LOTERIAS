<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>Gerador de Palpites - THOR LOTERIAS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 8%,#0d2b53 0,#06172c 32%,#020812 100%);color:#fff;font-family:Arial,sans-serif}.head{height:70px;display:flex;align-items:center;gap:18px;padding:0 18px;background:linear-gradient(180deg,#17385e,#071625 70%,#020914);border-bottom:2px solid #ff8a00;box-shadow:inset 0 2px 6px rgba(255,255,255,.16),0 0 12px #ff7900;position:sticky;top:0;z-index:5}.head strong{font-size:25px;font-weight:900;font-style:italic;text-shadow:0 2px 2px #000}.head strong em{color:#ff8a00;font-style:italic}.back{width:58px;height:50px;border:2px solid #ff9a00;border-radius:14px;background:linear-gradient(180deg,#17324c,#06101b);box-shadow:inset 0 2px 4px rgba(255,255,255,.22),0 0 9px #ff7a00;color:#ff9b22;font-size:31px;font-weight:900}.body{max-width:720px;margin:auto;padding:20px 14px 34px}.choose-title{text-align:center;font-size:23px;font-weight:900;font-style:italic;margin:4px 0 24px;background:linear-gradient(180deg,#173d67,#07192c);border:1px solid #168cff;border-radius:16px;padding:8px 24px;width:max-content;max-width:90%;margin-left:auto;margin-right:auto;box-shadow:inset 0 2px 3px rgba(255,255,255,.14),0 0 9px rgba(22,140,255,.45)}.lot-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lot-card{height:96px;position:relative;display:flex;align-items:center;gap:13px;padding:10px 15px;border:2px solid #ff8a00;border-radius:22px;background:linear-gradient(150deg,#17466e 0%,#0b2238 27%,#06121f 66%,#020811 100%);box-shadow:inset 0 3px 5px rgba(255,255,255,.16),inset 0 -5px 9px rgba(0,0,0,.65),0 0 7px #ff8a00;color:#fff;text-align:left;font-size:18px;font-weight:900;cursor:pointer}.lot-card:before{content:'';position:absolute;left:6%;top:4px;width:78%;height:28%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent);pointer-events:none}.lot-card.active{background:linear-gradient(145deg,#9228f4,#5014b7 58%,#1b083f);box-shadow:inset 0 3px 7px rgba(255,255,255,.3),0 0 11px #a52cff,0 0 17px #ff8a00}.flower{width:52px;height:52px;display:grid;place-items:center;font-size:45px;line-height:1;filter:drop-shadow(0 0 6px currentColor)}.lot-card[data-key=lotofacil] .flower,.lot-card[data-key=duplasena] .flower{color:#c34cff}.lot-card[data-key=megasena] .flower{color:#22e66b}.lot-card[data-key=quina] .flower{color:#28a9ff}.lot-card[data-key=lotomania] .flower{color:#ff9e22}.lot-card[data-key=diadesorte] .flower{color:#ffd329}.lot-card[data-key=timemania] .flower{color:#ff3654}.lot-card[data-key=supersete] .flower{color:#14ded8}.radio{margin-left:auto;width:31px;height:31px;border:3px solid #ff8a00;border-radius:50%;box-shadow:inset 0 0 5px #000}.lot-card.active .radio{border-color:#fff;box-shadow:inset 0 0 0 6px #721be5,0 0 8px #fff}.controls{margin-top:24px;padding:17px 20px;background:linear-gradient(160deg,#0b2a49,#061522);border:1px solid #217ab7;border-radius:22px;box-shadow:inset 0 2px 4px rgba(255,255,255,.08),0 0 8px rgba(0,129,255,.25)}.label{display:block;font-size:15px;font-weight:900;color:#fff;margin:0 0 10px}.field{width:100%;height:58px;background:linear-gradient(180deg,#123552,#071827);border:2px solid #ff9a00;border-radius:12px;color:#fff;padding:0 16px;font-size:25px;font-weight:900;box-shadow:inset 0 2px 4px rgba(255,255,255,.1),0 0 6px rgba(255,138,0,.55)}.go{width:96%;margin:22px 2% 0;height:72px;border:2px solid #ff9a00;border-radius:28px;background:linear-gradient(180deg,#27e962,#0aa63e 52%,#036923);box-shadow:inset 0 5px 6px rgba(255,255,255,.48),inset 0 -7px 10px rgba(0,0,0,.5),0 0 9px #ff8a00;color:#fff;font-size:25px;font-weight:900;text-shadow:0 2px 2px #064b24}.status{text-align:center;color:#6dd6ff;font-size:14px;margin:22px 2% 0;padding:18px;background:linear-gradient(160deg,#0b2945,#06131f);border:1px solid #1974ad;border-radius:20px}.game{border:1px solid #ff8a00;background:#0b1725;border-radius:13px;padding:10px;margin:8px 0}.line{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px}.pct{color:#7dffb8;font-size:15px;min-width:42px}.balls{display:flex;flex-wrap:wrap;gap:5px}.ball{width:29px;height:29px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(#9b48df,#5d168f);border:1px solid #d9a8ff;font-size:11px;font-weight:900}@media(max-width:480px){.head{height:64px;padding:0 10px}.head strong{font-size:20px}.back{width:50px;height:43px}.body{padding:16px 8px 28px}.choose-title{font-size:20px;margin-bottom:18px}.lot-grid{gap:7px}.lot-card{height:82px;padding:8px 9px;gap:7px;border-radius:19px;font-size:15px}.flower{width:39px;height:39px;font-size:36px}.radio{width:27px;height:27px}.controls{margin-top:18px;padding:14px}.field{height:52px}.go{height:62px;font-size:20px}}</style></head><body><div class="head"><button class="back" onclick="history.back()">←</button><strong>Gerador de <em>Palpites</em></strong></div><main class="body"><h2 class="choose-title">Escolha a Loteria</h2><div class="lot-grid" id="lotGrid"><button class="lot-card active" data-key="lotofacil"><span class="flower">✤</span><span>Lotofácil</span><i class="radio"></i></button><button class="lot-card" data-key="megasena"><span class="flower">✤</span><span>Mega-Sena</span><i class="radio"></i></button><button class="lot-card" data-key="quina"><span class="flower">✤</span><span>Quina</span><i class="radio"></i></button><button class="lot-card" data-key="lotomania"><span class="flower">✤</span><span>Lotomania</span><i class="radio"></i></button><button class="lot-card" data-key="diadesorte"><span class="flower">✤</span><span>Dia de Sorte</span><i class="radio"></i></button><button class="lot-card" data-key="timemania"><span class="flower">✤</span><span>Timemania</span><i class="radio"></i></button><button class="lot-card" data-key="duplasena"><span class="flower">✤</span><span>Dupla Sena</span><i class="radio"></i></button><button class="lot-card" data-key="supersete"><span class="flower">✤</span><span>Super Sete</span><i class="radio"></i></button></div><div class="controls"><label class="label">Concursos para analisar (10 a 500)</label><input class="field" id="conc" type="number" min="10" max="500" value="50" inputmode="numeric"><select id="lot" hidden><option value="lotofacil">Lotofácil</option><option value="megasena">Mega-Sena</option><option value="quina">Quina</option><option value="lotomania">Lotomania</option><option value="diadesorte">Dia de Sorte</option><option value="timemania">Timemania</option><option value="duplasena">Dupla Sena</option><option value="supersete">Super Sete</option></select></div><button class="go" id="gerar">🎲 &nbsp; GERAR 30 JOGOS &nbsp; ›</button><div class="status" id="status">ⓘ &nbsp; Escolha a loteria e a quantidade de concursos.</div><div id="out"></div></main><script>const cfg={lotofacil:{api:'lotofacil',max:25,qtd:15,min:1},megasena:{api:'megasena',max:60,qtd:6,min:1},quina:{api:'quina',max:80,qtd:5,min:1},lotomania:{api:'lotomania',max:99,qtd:50,min:0},diadesorte:{api:'diadesorte',max:31,qtd:7,min:1},timemania:{api:'timemania',max:80,qtd:10,min:1},duplasena:{api:'duplasena',max:50,qtd:6,min:1},supersete:{api:'supersete',max:9,qtd:7,min:0}};const $=x=>document.getElementById(x);document.querySelectorAll('.lot-card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lot-card').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('lot').value=b.dataset.key});async function api(tipo,n){let u='https://servicebus2.caixa.gov.br/portaldeloterias/api/'+tipo+(n?'/'+n:'');let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP');return r.json()}function dz(d){let a=d&&(d.listaDezenas||d.dezenas||d.numeros);return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}function pick(pool,score,qtd){let p=pool.slice(),j=[];while(j.length<qtd&&p.length){let total=p.reduce((s,x)=>s+(score[x]||.001),0),r=Math.random()*total,sel=p[0];for(let x of p){r-=score[x]||.001;if(r<=0){sel=x;break}}j.push(sel);p.splice(p.indexOf(sel),1)}return j.sort((a,b)=>a-b)}$('gerar').onclick=async()=>{let key=$('lot').value,c=cfg[key],n=Math.max(10,Math.min(500,parseInt($('conc').value)||50)),st=$('status'),out=$('out');st.textContent='Analisando '+n+' concursos...';out.innerHTML='';try{let ult=await api(c.api),numero=Number(ult.numero||ult.concurso),hist=[];for(let i=0;i<n&&numero-i>0;i++){try{let d=i?await api(c.api,numero-i):ult,a=dz(d);if(a.length)hist.push(a)}catch(e){}}if(!hist.length)throw Error('sem histórico');if(key==='supersete'){let col=Array.from({length:7},()=>Array(10).fill(0));hist.forEach(j=>j.slice(0,7).forEach((v,i)=>{if(v>=0&&v<=9)col[i][v]++}));let jogos=[],seen=new Set();while(jogos.length<30){let j=col.map((a,i)=>{let total=a.reduce((s,v)=>s+v+1,0),r=Math.random()*total;for(let d=0;d<10;d++){r-=a[d]+1;if(r<=0)return d}return 0}),k=j.join('');if(!seen.has(k)){seen.add(k);let raw=j.reduce((s,v,i)=>s+(col[i][v]+1)/(hist.length+10),0)/7;jogos.push({j,p:Math.max(1,Math.min(99,Math.round(raw*100)))})}}jogos.sort((a,b)=>b.p-a.p);render(jogos,key,hist.length);return}let size=c.max-c.min+1,freq=Array(c.max+1).fill(0),last=Array(c.max+1).fill(hist.length);hist.forEach((j,i)=>j.forEach(x=>{if(x>=c.min&&x<=c.max){freq[x]++;if(last[x]===hist.length)last[x]=i}}));let score=[];for(let x=c.min;x<=c.max;x++){let f=freq[x]/hist.length,r=1-Math.min(last[x],hist.length)/hist.length,a=Math.min(last[x]/Math.max(1,hist.length*.25),1);score[x]=.55*f+.25*r+.20*a+.03}let pool=Array.from({length:size},(_,i)=>i+c.min),jogos=[],seen=new Set(),tries=0,max=Math.max(...pool.map(x=>score[x]));while(jogos.length<30&&tries++<10000){let j=pick(pool,score,c.qtd),k=j.join('-');if(!seen.has(k)){seen.add(k);let raw=j.reduce((s,x)=>s+score[x],0)/j.length;jogos.push({j,p:Math.max(1,Math.min(99,Math.round(raw/max*100)))})}}jogos.sort((a,b)=>b.p-a.p);render(jogos,key,hist.length)}catch(e){st.textContent='Não foi possível carregar o histórico agora. Tente novamente.'}};function render(jogos,key,n){$('out').innerHTML=jogos.map((o,i)=>'<div class="game"><div class="line"><span class="pct">'+o.p+'%</span><span>Jogo '+String(i+1).padStart(2,'0')+'</span></div><div class="balls">'+o.j.map(x=>'<span class="ball">'+String(x).padStart(2,'0')+'</span>').join('')+'</div></div>').join('');$('status').textContent=jogos.length+' jogos gerados com base em '+n+' concursos. Porcentagem = índice histórico, não chance de prêmio.'}</script></body></html>
