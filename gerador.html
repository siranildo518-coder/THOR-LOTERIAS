<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>Gerador de Palpites - THOR LOTERIAS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#10243a 0,#071321 34%,#030a13 100%);color:#fff;font-family:Arial,sans-serif}.head{height:74px;display:flex;align-items:center;gap:16px;padding:0 20px;background:linear-gradient(180deg,#172536,#0a1420);border-top:1px solid #ff8a00;border-bottom:2px solid #ff8a00;box-shadow:inset 0 2px 6px rgba(255,255,255,.08),0 0 12px rgba(255,138,0,.25);position:sticky;top:0;z-index:5}.head strong{font-size:25px;font-weight:900;text-shadow:0 2px 2px #000}.back{width:58px;height:48px;border:2px solid #ff8a00;border-radius:14px;background:linear-gradient(180deg,#1b2c3d,#08111b);box-shadow:inset 0 2px 4px rgba(255,255,255,.18),0 0 7px #ff8a00;color:#ff9b22;font-size:31px;font-weight:900}.body{max-width:700px;margin:auto;padding:24px 14px 30px}.choose-title{text-align:center;font-size:23px;font-weight:900;margin:0 0 28px;text-shadow:0 2px 2px #000}.choose-title:after{content:'';display:block;width:190px;height:4px;border-radius:9px;background:#ff7a00;margin:8px auto 0;box-shadow:0 0 8px #ff7a00}.lot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lot-card{height:108px;position:relative;display:flex;align-items:center;gap:16px;padding:12px 17px;border:2px solid #ff7a00;border-radius:25px;background:linear-gradient(155deg,#203446 0%,#0b1722 56%,#07101a 100%);box-shadow:inset 0 3px 5px rgba(255,255,255,.13),inset 0 -5px 9px rgba(0,0,0,.55),0 0 8px rgba(255,122,0,.45);color:#fff;text-align:left;font-size:20px;font-weight:900;cursor:pointer}.lot-card:before{content:'';position:absolute;left:9%;top:5px;width:72%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.13),transparent);pointer-events:none}.lot-card.active{background:linear-gradient(145deg,#8d30ef,#44139e 58%,#24104e);box-shadow:inset 0 3px 7px rgba(255,255,255,.28),0 0 12px #a52cff,0 0 19px rgba(255,122,0,.55)}.flower{width:57px;height:57px;display:grid;place-items:center;font-size:49px;line-height:1;filter:drop-shadow(0 0 7px currentColor)}.lot-card[data-key=lotofacil] .flower,.lot-card[data-key=duplasena] .flower{color:#c34cff}.lot-card[data-key=megasena] .flower{color:#25df80}.lot-card[data-key=quina] .flower{color:#35aaff}.lot-card[data-key=lotomania] .flower{color:#ffa62d}.lot-card[data-key=diadesorte] .flower{color:#ffd329}.lot-card[data-key=timemania] .flower{color:#ff3654}.lot-card[data-key=supersete] .flower{color:#19e5dc}.radio{margin-left:auto;width:35px;height:35px;border:3px solid #ff8a00;border-radius:50%;box-shadow:inset 0 0 5px #000}.lot-card.active .radio{border-color:#fff;box-shadow:inset 0 0 0 7px #6c16e5,0 0 8px #fff}.continue,.go{width:94%;margin:48px 3% 0;height:68px;border:2px solid #ff8a00;border-radius:35px;background:linear-gradient(180deg,#22e66b,#07923e 58%,#036329);box-shadow:inset 0 4px 5px rgba(255,255,255,.45),inset 0 -6px 9px rgba(0,0,0,.45),0 0 8px #ff8a00;color:#fff;font-size:25px;font-weight:900;text-shadow:0 2px 2px #064b24}.setup{display:none}.setup.show{display:block}.chooser.hide{display:none}.card{background:linear-gradient(155deg,#172a3d,#08121e);border:2px solid #ff8a00;border-radius:22px;padding:18px;box-shadow:0 0 10px rgba(255,138,0,.4)}.label{display:block;font-size:14px;font-weight:800;color:#dcecff;margin:0 0 7px}.field{width:100%;height:48px;background:#071522;border:1px solid #ff8a00;border-radius:12px;color:#fff;padding:0 12px;font-size:16px;margin-bottom:14px}.go{width:100%;margin:4px 0 0;height:54px;font-size:17px}.status{text-align:center;color:#bed3e5;font-size:12px;margin:14px 0}.game{border:1px solid #ff8a00;background:#0b1725;border-radius:13px;padding:10px;margin:8px 0}.line{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px}.pct{color:#7dffb8;font-size:15px;min-width:42px}.balls{display:flex;flex-wrap:wrap;gap:5px}.ball{width:29px;height:29px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(#9b48df,#5d168f);border:1px solid #d9a8ff;font-size:11px;font-weight:900}@media(max-width:480px){.head{height:64px;padding:0 12px}.head strong{font-size:20px}.back{width:52px;height:43px}.body{padding:20px 10px}.lot-grid{gap:8px}.lot-card{height:91px;padding:9px 11px;gap:8px;border-radius:22px;font-size:16px}.flower{width:44px;height:44px;font-size:39px}.radio{width:29px;height:29px}.continue{margin-top:34px;height:60px;font-size:22px}}</style></head><body><div class="head"><button class="back" onclick="history.back()">←</button><strong>Gerador de Palpites</strong></div><main class="body"><section class="chooser" id="chooser"><h2 class="choose-title">Escolha a Loteria</h2><div class="lot-grid" id="lotGrid"><button class="lot-card active" data-key="lotofacil"><span class="flower">✤</span><span>Lotofácil</span><i class="radio"></i></button><button class="lot-card" data-key="megasena"><span class="flower">✤</span><span>Mega-Sena</span><i class="radio"></i></button><button class="lot-card" data-key="quina"><span class="flower">✤</span><span>Quina</span><i class="radio"></i></button><button class="lot-card" data-key="lotomania"><span class="flower">✤</span><span>Lotomania</span><i class="radio"></i></button><button class="lot-card" data-key="diadesorte"><span class="flower">✤</span><span>Dia de Sorte</span><i class="radio"></i></button><button class="lot-card" data-key="timemania"><span class="flower">✤</span><span>Timemania</span><i class="radio"></i></button><button class="lot-card" data-key="duplasena"><span class="flower">✤</span><span>Dupla Sena</span><i class="radio"></i></button><button class="lot-card" data-key="supersete"><span class="flower">✤</span><span>Super Sete</span><i class="radio"></i></button></div><button class="continue" id="continuar">Continuar&nbsp; →</button></section><section class="setup" id="setup"><div class="card"><label class="label">Loteria escolhida</label><select class="field" id="lot"><option value="lotofacil">Lotofácil</option><option value="megasena">Mega-Sena</option><option value="quina">Quina</option><option value="lotomania">Lotomania</option><option value="diadesorte">Dia de Sorte</option><option value="timemania">Timemania</option><option value="duplasena">Dupla Sena</option><option value="supersete">Super Sete</option></select><label class="label">Concursos para analisar (10 a 500)</label><input class="field" id="conc" type="number" min="10" max="500" value="50" inputmode="numeric"><button class="go" id="gerar">GERAR 30 JOGOS</button><div class="status" id="status">Escolha a quantidade de concursos.</div></div><div id="out"></div></section></main><script>const cfg={lotofacil:{api:'lotofacil',max:25,qtd:15,min:1},megasena:{api:'megasena',max:60,qtd:6,min:1},quina:{api:'quina',max:80,qtd:5,min:1},lotomania:{api:'lotomania',max:99,qtd:50,min:0},diadesorte:{api:'diadesorte',max:31,qtd:7,min:1},timemania:{api:'timemania',max:80,qtd:10,min:1},duplasena:{api:'duplasena',max:50,qtd:6,min:1},supersete:{api:'supersete',max:9,qtd:7,min:0}};const $=x=>document.getElementById(x);document.querySelectorAll('.lot-card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lot-card').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('lot').value=b.dataset.key});$('continuar').onclick=()=>{$('chooser').classList.add('hide');$('setup').classList.add('show');scrollTo(0,0)};async function api(tipo,n){let u='https://servicebus2.caixa.gov.br/portaldeloterias/api/'+tipo+(n?'/'+n:'');let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP');return r.json()}function dz(d){let a=d&&(d.listaDezenas||d.dezenas||d.numeros);return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}function pick(pool,score,qtd){let p=pool.slice(),j=[];while(j.length<qtd&&p.length){let total=p.reduce((s,x)=>s+(score[x]||.001),0),r=Math.random()*total,sel=p[0];for(let x of p){r-=score[x]||.001;if(r<=0){sel=x;break}}j.push(sel);p.splice(p.indexOf(sel),1)}return j.sort((a,b)=>a-b)}$('gerar').onclick=async()=>{let key=$('lot').value,c=cfg[key],n=Math.max(10,Math.min(500,parseInt($('conc').value)||50)),st=$('status'),out=$('out');st.textContent='Analisando '+n+' concursos...';out.innerHTML='';try{let ult=await api(c.api),numero=Number(ult.numero||ult.concurso),hist=[];for(let i=0;i<n&&numero-i>0;i++){try{let d=i?await api(c.api,numero-i):ult,a=dz(d);if(a.length)hist.push(a)}catch(e){}}if(!hist.length)throw Error('sem histórico');if(key==='supersete'){let col=Array.from({length:7},()=>Array(10).fill(0));hist.forEach(j=>j.slice(0,7).forEach((v,i)=>{if(v>=0&&v<=9)col[i][v]++}));let jogos=[],seen=new Set();while(jogos.length<30){let j=col.map((a,i)=>{let total=a.reduce((s,v)=>s+v+1,0),r=Math.random()*total;for(let d=0;d<10;d++){r-=a[d]+1;if(r<=0)return d}return 0}),k=j.join('');if(!seen.has(k)){seen.add(k);let raw=j.reduce((s,v,i)=>s+(col[i][v]+1)/(hist.length+10),0)/7;jogos.push({j,p:Math.max(1,Math.min(99,Math.round(raw*100)))})}}jogos.sort((a,b)=>b.p-a.p);render(jogos,key,hist.length);return}let size=c.max-c.min+1,freq=Array(c.max+1).fill(0),last=Array(c.max+1).fill(hist.length);hist.forEach((j,i)=>j.forEach(x=>{if(x>=c.min&&x<=c.max){freq[x]++;if(last[x]===hist.length)last[x]=i}}));let score=[];for(let x=c.min;x<=c.max;x++){let f=freq[x]/hist.length,r=1-Math.min(last[x],hist.length)/hist.length,a=Math.min(last[x]/Math.max(1,hist.length*.25),1);score[x]=.55*f+.25*r+.20*a+.03}let pool=Array.from({length:size},(_,i)=>i+c.min),jogos=[],seen=new Set(),tries=0,max=Math.max(...pool.map(x=>score[x]));while(jogos.length<30&&tries++<10000){let j=pick(pool,score,c.qtd),k=j.join('-');if(!seen.has(k)){seen.add(k);let raw=j.reduce((s,x)=>s+score[x],0)/j.length;jogos.push({j,p:Math.max(1,Math.min(99,Math.round(raw/max*100)))})}}jogos.sort((a,b)=>b.p-a.p);render(jogos,key,hist.length)}catch(e){st.textContent='Não foi possível carregar o histórico agora. Tente novamente.'}};function render(jogos,key,n){$('out').innerHTML=jogos.map((o,i)=>'<div class="game"><div class="line"><span class="pct">'+o.p+'%</span><span>Jogo '+String(i+1).padStart(2,'0')+'</span></div><div class="balls">'+o.j.map(x=>'<span class="ball">'+String(x).padStart(2,'0')+'</span>').join('')+'</div></div>').join('');$('status').textContent=jogos.length+' jogos gerados com base em '+n+' concursos. Porcentagem = índice histórico, não chance de prêmio.'}</script></body></html>
