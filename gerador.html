<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>Gerador de Palpites</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 8%,#0d2b53,#06172c 32%,#020812 100%);color:#fff;font-family:Arial,sans-serif}.head{height:64px;display:flex;align-items:center;gap:14px;padding:0 10px;background:linear-gradient(180deg,#17385e,#071625 70%,#020914);border-bottom:2px solid #ff8a00;box-shadow:0 0 12px #ff7900}.head strong{font-size:21px;font-weight:900;font-style:italic}.head em{color:#ff8a00}.back{width:50px;height:43px;border:2px solid #ff9a00;border-radius:14px;background:#091727;color:#ff9b22;font-size:28px}.body{max-width:720px;margin:auto;padding:18px 10px 32px}.filter{position:relative;margin:0 auto 18px;max-width:520px}.filterBtn,.choice{width:100%;height:58px;display:flex;align-items:center;gap:12px;padding:0 17px;border:2px solid #ff8a00;border-radius:20px;background:linear-gradient(150deg,#173d60,#081827 45%,#030a12);color:#fff;font-size:20px;font-weight:900;box-shadow:inset 0 3px 5px rgba(255,255,255,.13),0 0 8px rgba(255,138,0,.7)}.filterBtn .arrow{margin-left:auto;color:#ff9800;font-size:24px}.menu{display:none;position:absolute;z-index:20;left:0;right:0;top:64px;padding:6px;background:#06111e;border:2px solid #ff8a00;border-radius:18px;box-shadow:0 0 15px rgba(255,138,0,.7)}.filter.open .menu{display:block}.opt{width:100%;height:50px;display:flex;align-items:center;gap:11px;border:0;border-bottom:1px solid #173a57;background:transparent;color:#fff;font-size:17px;font-weight:800;text-align:left}.opt:last-child{border-bottom:0}.flower{font-size:29px;filter:drop-shadow(0 0 5px currentColor)}.c-lotofacil,.c-duplasena{color:#c34cff}.c-megasena{color:#22e66b}.c-quina{color:#28a9ff}.c-lotomania{color:#ff9e22}.c-diadesorte{color:#ffd329}.c-timemania{color:#ff3654}.c-supersete{color:#14ded8}.choice{display:none;margin:0 auto 18px;max-width:520px;height:62px}.choice.show{display:flex}.choice .radio{margin-left:auto;width:28px;height:28px;border:3px solid #fff;border-radius:50%;box-shadow:inset 0 0 0 6px #721be5,0 0 8px #fff}.controls{margin-top:18px;padding:14px 16px;background:linear-gradient(160deg,#0b2a49,#061522);border:1px solid #217ab7;border-radius:20px}.label{display:block;font-size:14px;font-weight:900;margin-bottom:9px}.field{width:100%;height:52px;background:#0c2740;border:2px solid #ff9a00;border-radius:12px;color:#fff;padding:0 16px;font-size:24px;font-weight:900}.go{width:96%;margin:20px 2% 0;height:62px;border:2px solid #ff9a00;border-radius:26px;background:linear-gradient(180deg,#27e962,#0aa63e 52%,#036923);box-shadow:inset 0 4px 5px rgba(255,255,255,.45),0 0 9px #ff8a00;color:#fff;font-size:20px;font-weight:900}.status{text-align:center;color:#6dd6ff;font-size:13px;margin:20px 2% 0;padding:15px;background:#071827;border:1px solid #1974ad;border-radius:18px}.game{border:1px solid #ff8a00;background:#0b1725;border-radius:13px;padding:10px;margin:8px 0}.line{display:flex;gap:9px;font-size:13px;font-weight:800;margin-bottom:8px}.pct{color:#7dffb8;font-size:15px}.balls{display:flex;flex-wrap:wrap;gap:5px}.ball{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#9b48df,#5d168f);border:1px solid #d9a8ff;font-size:11px;font-weight:900}</style></head><body><div class="head"><button class="back" onclick="history.back()">←</button><strong>Gerador de <em>Palpites</em></strong></div><main class="body"><div class="filter" id="filter"><button class="filterBtn" id="filterBtn"><span id="filterLabel">Escolha a Loteria</span><span class="arrow">▼</span></button><div class="menu" id="menu"></div></div><button class="choice" id="choice"><span class="flower" id="choiceIcon">✤</span><span id="choiceName"></span><i class="radio"></i></button><div class="controls"><label class="label">Concursos para analisar (10 a 500)</label><input class="field" id="conc" type="number" min="10" max="500" value="50" inputmode="numeric"><input id="lot" type="hidden" value=""></div><button class="go" id="gerar">🎲 &nbsp; GERAR 30 JOGOS &nbsp; ›</button><div class="status" id="status">ⓘ &nbsp; Escolha a loteria e a quantidade de concursos.</div><div id="out"></div></main><script>const cfg={lotofacil:{nome:'Lotofácil',api:'lotofacil',max:25,qtd:15,min:1},megasena:{nome:'Mega-Sena',api:'megasena',max:60,qtd:6,min:1},quina:{nome:'Quina',api:'quina',max:80,qtd:5,min:1},lotomania:{nome:'Lotomania',api:'lotomania',max:99,qtd:50,min:0},diadesorte:{nome:'Dia de Sorte',api:'diadesorte',max:31,qtd:7,min:1},timemania:{nome:'Timemania',api:'timemania',max:80,qtd:10,min:1},duplasena:{nome:'Dupla Sena',api:'duplasena',max:50,qtd:6,min:1},supersete:{nome:'Super Sete',api:'supersete',max:9,qtd:7,min:0}};const $=x=>document.getElementById(x),filter=$('filter'),menu=$('menu');menu.innerHTML=Object.entries(cfg).map(([k,v])=>'<button class="opt" data-key="'+k+'"><span class="flower c-'+k+'">✤</span>'+v.nome+'</button>').join('');$('filterBtn').onclick=()=>filter.classList.toggle('open');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let k=b.dataset.key;$('lot').value=k;$('choiceName').textContent=cfg[k].nome;$('choiceIcon').className='flower c-'+k;$('choice').classList.add('show');$('filterLabel').textContent='Escolha a Loteria';filter.classList.remove('open');$('status').textContent='ⓘ  '+cfg[k].nome+' selecionada. Escolha os concursos e gere os jogos.'});$('choice').onclick=()=>filter.classList.add('open');document.addEventListener('click',e=>{if(!filter.contains(e.target)&&!$('choice').contains(e.target))filter.classList.remove('open')});async function api(t,n){let r=await fetch('https://servicebus2.caixa.gov.br/portaldeloterias/api/'+t+(n?'/'+n:''),{cache:'no-store'});if(!r.ok)throw Error();return r.json()}function dz(d){let a=d&&(d.listaDezenas||d.dezenas||d.numeros);return Array.isArray(a)?a.map(Number).filter(Number.isFinite):[]}function pick(pool,score,q){let p=pool.slice(),j=[];while(j.length<q&&p.length){let total=p.reduce((s,x)=>s+(score[x]||.001),0),r=Math.random()*total,sel=p[0];for(let x of p){r-=score[x]||.001;if(r<=0){sel=x;break}}j.push(sel);p.splice(p.indexOf(sel),1)}return j.sort((a,b)=>a-b)}$('gerar').onclick=async()=>{let key=$('lot').value;if(!key){$('status').textContent='Escolha uma loteria primeiro.';filter.classList.add('open');return}let c=cfg[key],n=Math.max(10,Math.min(500,parseInt($('conc').value)||50)),st=$('status');st.textContent='Analisando '+n+' concursos...';$('out').innerHTML='';try{let ult=await api(c.api),numero=Number(ult.numero||ult.concurso),hist=[];for(let i=0;i<n&&numero-i>0;i++){try{let d=i?await api(c.api,numero-i):ult,a=dz(d);if(a.length)hist.push(a)}catch(e){}}if(!hist.length)throw Error();if(key==='supersete'){let col=Array.from({length:7},()=>Array(10).fill(0));hist.forEach(j=>j.slice(0,7).forEach((v,i)=>col[i][v]++));let jogos=[],seen=new Set();while(jogos.length<30){let j=col.map(a=>{let total=a.reduce((s,v)=>s+v+1,0),r=Math.random()*total;for(let d=0;d<10;d++){r-=a[d]+1;if(r<=0)return d}return 0}),k=j.join('');if(!seen.has(k)){seen.add(k);jogos.push({j,p:Math.round(j.reduce((s,v,i)=>s+(col[i][v]+1)/(hist.length+10),0)/7*100)})}}return render(jogos,key,hist.length)}let freq=Array(c.max+1).fill(0),last=Array(c.max+1).fill(hist.length);hist.forEach((j,i)=>j.forEach(x=>{if(x>=c.min&&x<=c.max){freq[x]++;if(last[x]===hist.length)last[x]=i}}));let score=[];for(let x=c.min;x<=c.max;x++)score[x]=.55*freq[x]/hist.length+.25*(1-Math.min(last[x],hist.length)/hist.length)+.20*Math.min(last[x]/Math.max(1,hist.length*.25),1)+.03;let pool=Array.from({length:c.max-c.min+1},(_,i)=>i+c.min),max=Math.max(...pool.map(x=>score[x])),jogos=[],seen=new Set(),tries=0;while(jogos.length<30&&tries++<10000){let j=pick(pool,score,c.qtd),k=j.join('-');if(!seen.has(k)){seen.add(k);jogos.push({j,p:Math.max(1,Math.min(99,Math.round(j.reduce((s,x)=>s+score[x],0)/j.length/max*100)))})}}render(jogos,key,hist.length)}catch(e){st.textContent='Não foi possível carregar o histórico agora. Tente novamente.'}};function render(jogos,key,n){jogos.sort((a,b)=>b.p-a.p);$('out').innerHTML=jogos.map((o,i)=>'<div class="game"><div class="line"><span class="pct">'+o.p+'%</span><span>Jogo '+String(i+1).padStart(2,'0')+'</span></div><div class="balls">'+o.j.map(x=>'<span class="ball">'+String(x).padStart(2,'0')+'</span>').join('')+'</div></div>').join('');$('status').textContent=jogos.length+' jogos gerados com base em '+n+' concursos. Porcentagem = índice histórico, não chance de prêmio.'}</script></body></html>
