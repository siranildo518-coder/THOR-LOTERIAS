name: Publicar correcao Lotofacil 2144
on:
  push:
    paths:
      - '.github/workflows/apply-config-height-2019.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix-lotofacil-sorteio-2144.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corrigir sorteio Lotofacil 2144'
          git push
