name: Publicar busca rapida 2308
on:
  push:
    paths:
      - '.github/workflows/apply-config-height-2019.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar atualizacao
        run: python3 .github/scripts/fix-lotofacil-sorteio-2144.py
      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>', s, re.S)
          Path('/tmp/thor-scripts.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/thor-scripts.js
      - name: Publicar index e sw
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Acelerar busca de resultados 2308'
          git push
