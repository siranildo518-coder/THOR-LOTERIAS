name: Fix Tendencia Update Lock 2005
on:
  push:
    paths:
      - .github/workflows/fix-tendencia-update-lock-2005.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""const homePremiumCardTendencia = document.getElementById('homePremiumCardTendencia');\nif(homePremiumCardTendencia){\n  homePremiumCardTendencia.addEventListener('click', ()=>{\n    if(homePremiumCardTendencia.dataset.abrindo === '1') return;\n    homePremiumCardTendencia.dataset.abrindo = '1';\n    homePremiumCardTendencia.classList.add('is-pressed');\n    try{\n      abrirAltaQueda();\n    } catch(err){\n      console.error('Falha ao abrir Tendência:', err);\n    } finally {\n      setTimeout(()=>{\n        homePremiumCardTendencia.classList.remove('is-pressed');\n        homePremiumCardTendencia.dataset.abrindo = '0';\n      }, 180);\n    }\n  });\n}"""
          new="""function abrirTendenciaPelaHome(){\n  const card=document.getElementById('homePremiumCardTendencia');\n  if(!card) return;\n  card.dataset.abrindo='0'; card.classList.remove('is-pressed'); card.style.pointerEvents='';\n  card.dataset.abrindo='1'; card.classList.add('is-pressed');\n  try{ abrirAltaQueda(); } catch(err){ console.error('Falha ao abrir Tendência:',err); }\n  finally{ setTimeout(()=>{card.classList.remove('is-pressed');card.dataset.abrindo='0';},180); }\n}\ndocument.addEventListener('click',(ev)=>{const alvo=ev.target&&ev.target.closest?ev.target.closest('#homePremiumCardTendencia'):null;if(!alvo)return;ev.preventDefault();abrirTendenciaPelaHome();});"""
          if old in s: s=s.replace(old,new,1)
          elif 'function abrirTendenciaPelaHome()' not in s: raise SystemExit('Tendencia nao encontrada')
          marker="try{ localStorage.setItem(APP_VERSAO_VISTA_KEY, APP_VERSAO_ATUAL); }catch(e){}"
          add=marker+"\n  const cardTendencia=document.getElementById('homePremiumCardTendencia');\n  if(cardTendencia){cardTendencia.dataset.abrindo='0';cardTendencia.classList.remove('is-pressed');cardTendencia.style.pointerEvents='';}"
          if marker in s and 'const cardTendencia=document.getElementById' not in s: s=s.replace(marker,add,1)
          s=re.sub(r"const APP_VERSAO_ATUAL = '[^']+';","const APP_VERSAO_ATUAL = '2026-09-11-2005';",s,1)
          p.write_text(s,encoding='utf-8')
          q=Path('sw.js'); sw=q.read_text(encoding='utf-8'); sw=re.sub(r"const CACHE_NAME = 'thor-loterias-[^']+';","const CACHE_NAME = 'thor-loterias-2026-09-11-2005';",sw,1); q.write_text(sw,encoding='utf-8')
          PY
      - name: Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir Tendencia apos Atualizar 2005'
          git push
