name: Fix Tendencia Update Lock 2005
on:
  push:
    paths:
      - .github/workflows/fix-tendencia-update-lock-2005.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')

          pat=r"const homePremiumCardTendencia = document\.getElementById\('homePremiumCardTendencia'\);\s*homePremiumCardTendencia\.addEventListener\('click', \(\)=>\{.*?\n\}\);"
          novo="""function abrirTendenciaPelaHome(){
  const card=document.getElementById('homePremiumCardTendencia');
  if(!card) return;
  card.dataset.abrindo='0';
  card.classList.remove('is-pressed');
  card.style.pointerEvents='';
  card.dataset.abrindo='1';
  card.classList.add('is-pressed');
  try{ abrirAltaQueda(); }
  catch(err){ console.error('Falha ao abrir Tendência:',err); }
  finally{ setTimeout(()=>{card.classList.remove('is-pressed');card.dataset.abrindo='0';},180); }
}
document.addEventListener('click',(ev)=>{
  const alvo=ev.target&&ev.target.closest?ev.target.closest('#homePremiumCardTendencia'):null;
  if(!alvo) return;
  ev.preventDefault();
  abrirTendenciaPelaHome();
});"""
          s,n=re.subn(pat,novo,s,count=1,flags=re.S)
          if n!=1 and 'function abrirTendenciaPelaHome()' not in s:
              raise SystemExit('Tendencia nao encontrada')

          pat_menu=r"document\.getElementById\('menuAtualizar'\)\?\.addEventListener\('click', function\(\)\{.*?\n\}\);"
          m=re.search(pat_menu,s,re.S)
          if not m:
              raise SystemExit('Botao Atualizar nao encontrado')
          bloco=m.group(0)
          if 'cardTendencia' not in bloco:
              bloco=bloco.replace("try{ localStorage.setItem(APP_VERSAO_VISTA_KEY, APP_VERSAO_ATUAL); }catch(e){}",
              "marcarAtualizacaoComoVista();\n  try{ localStorage.setItem(APP_VERSAO_VISTA_KEY, APP_VERSAO_ATUAL); }catch(e){}\n  const cardTendencia=document.getElementById('homePremiumCardTendencia');\n  if(cardTendencia){cardTendencia.dataset.abrindo='0';cardTendencia.classList.remove('is-pressed');cardTendencia.style.pointerEvents='';}")
              s=s[:m.start()]+bloco+s[m.end():]

          s=re.sub(r"const APP_VERSAO_ATUAL = '[^']+';","const APP_VERSAO_ATUAL = '2026-09-11-2005';",s,1)
          p.write_text(s,encoding='utf-8')

          q=Path('sw.js'); sw=q.read_text(encoding='utf-8')
          sw=re.sub(r"const CACHE_NAME = 'thor-loterias-[^']+';","const CACHE_NAME = 'thor-loterias-2026-09-11-2005';",sw,1)
          q.write_text(sw,encoding='utf-8')
          PY
      - name: Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir Tendencia apos Atualizar 2005'
          git push
