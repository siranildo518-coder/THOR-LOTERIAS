name: Corrigir Atualizar e Tendencia 2013

on:
  push:
    paths:
      - '.github/workflows/fix-update-tendencia-2013.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correcao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          versao = '2026-09-11-2013'
          tend_b64 = ''
          menu_b64 = ''
          tend = base64.b64decode(tend_b64).decode('utf-8')
          menu = base64.b64decode(menu_b64).decode('utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n1 = re.subn(r"// Mantém o efeito de afundar visível por um instante antes de abrir a próxima aba\..*?(?=document\.getElementById\('altaQuedaVoltar'\))", tend, s, count=1, flags=re.S)
          if n1 != 1 and 'function abrirTendenciaPelaHome()' not in s:
              raise SystemExit('Bloco Tendencia nao encontrado')

          s, n2 = re.subn(r"document\.getElementById\('menuAtualizar'\)\?\.addEventListener\('click', function\(\)\{.*?(?=document\.getElementById\('tendenciaVoltar'\))", menu, s, count=1, flags=re.S)
          if n2 != 1 and "addEventListener('click', async function()" not in s:
              raise SystemExit('Bloco Atualizar nao encontrado')

          s = re.sub(r"navigator\.serviceWorker\.register\('\./sw\.js\?v=[^']+', \{ updateViaCache:'none' \}\)", "navigator.serviceWorker.register(`./sw.js?v=${encodeURIComponent(APP_VERSAO_ATUAL)}`, { updateViaCache:'none' })", s, count=1)
          s = re.sub(r"const APP_VERSAO_ATUAL = '[^']+';", f"const APP_VERSAO_ATUAL = '{versao}';", s, count=1)
          p.write_text(s, encoding='utf-8')

          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = 'thor-loterias-[^']+';", f"const CACHE_NAME = 'thor-loterias-{versao}';", sw, count=1)
          swp.write_text(sw, encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir Atualizar e Tendencia 2013"
          git pull --rebase origin main
          git push
