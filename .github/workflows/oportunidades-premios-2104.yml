name: Oportunidades premios 2104
on:
  push:
    paths: ['.github/workflows/oportunidades-premios-2104.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar oportunidades
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          versao='2026-09-11-2104'
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          a="  let totalPremiados = 0;\n\n  const listaJogosHtml = jogos.map((jogo,i)=>{"
          b="  let totalPremiados = 0;\n  const distribuicaoAcertos = new Map();\n\n  const listaJogosHtml = jogos.map((jogo,i)=>{"
          if a in s: s=s.replace(a,b,1)

          a="    const faixa = conferindo ? faixaPremioGerador(g.code, hits) : null;\n    if(faixa) totalPremiados++;"
          b="    const faixa = conferindo ? faixaPremioGerador(g.code, hits) : null;\n    if(conferindo) distribuicaoAcertos.set(hits, (distribuicaoAcertos.get(hits) || 0) + 1);\n    if(faixa) totalPremiados++;"
          if a in s: s=s.replace(a,b,1)

          marcador="  out.innerHTML = `"
          oportunidades="""  const oportunidadesHtml = conferindo
    ? (FAIXAS_PREMIACAO_GERADOR[g.code] || []).map(f=>{
        const qtd = distribuicaoAcertos.get(f.h) || 0;
        return `<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 7px;border-bottom:1px solid #F0EAF7;\"><span style=\"font-family:'Baloo 2',sans-serif;font-size:11px;font-weight:700;color:#4B5563;\">${f.label}</span><span style=\"font-family:'Baloo 2',sans-serif;font-size:11px;font-weight:800;color:${qtd ? '#1F9D74' : '#8B7C9E'};\">${qtd} cart${qtd===1?'ão':'ões'} premiado${qtd===1?'':'s'}</span></div>`;
      }).join('')
    : '';

"""
          if 'const oportunidadesHtml = conferindo' not in s:
              if marcador not in s: raise SystemExit('out.innerHTML nao encontrado')
              s=s.replace(marcador,oportunidades+marcador,1)

          a="      ${resumoPremiacaoGerador(g.code)}\n    </div>"
          b="      ${resumoPremiacaoGerador(g.code)}\n      ${conferindo ? `<div style=\"margin-top:7px;border:1px solid #EFE7F7;border-radius:10px;overflow:hidden;background:#FCFAFF;\"><div style=\"padding:5px 7px;background:#F6F0FC;font-family:'Baloo 2',sans-serif;font-size:11px;font-weight:800;color:#7E22CE;\">🏆 Oportunidades de premiação</div>${oportunidadesHtml}</div>` : ''}\n    </div>"
          if '🏆 Oportunidades de premiação' not in s:
              if a not in s: raise SystemExit('resumo premiacao nao encontrado')
              s=s.replace(a,b,1)

          s,nv=re.subn(r"const APP_VERSAO_ATUAL = '[^']+';", f"const APP_VERSAO_ATUAL = '{versao}';", s, count=1)
          if nv!=1: raise SystemExit('Versao index nao encontrada')
          p.write_text(s,encoding='utf-8')

          swp=Path('sw.js')
          sw=swp.read_text(encoding='utf-8')
          sw,nw=re.subn(r"const CACHE_NAME = 'thor-loterias-[^']+';", f"const CACHE_NAME = 'thor-loterias-{versao}';", sw, count=1)
          if nw!=1: raise SystemExit('Versao sw nao encontrada')
          swp.write_text(sw,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar oportunidades de premiacao 2104"
          git pull --rebase origin main
          git push
