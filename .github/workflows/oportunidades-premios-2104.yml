name: Oportunidades premios 2104
on:
  push:
    paths: ['.github/workflows/oportunidades-premios-2104.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar oportunidades
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          versao='2026-09-11-2104'
          bloco=base64.b64decode('').decode('utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r"  const resumoAcertosHtml = conferindo.*?    : '';"
          s,n=re.subn(pat, bloco, s, count=1, flags=re.S)
          if n!=1:
              pat2=r"  const oportunidadesHtml = conferindo.*?    : '';"
              s,n=re.subn(pat2, bloco, s, count=1, flags=re.S)
          if n!=1: raise SystemExit('Resumo de acertos nao encontrado')
          s=s.replace('📊 Quantidade de cartões por acertos</div>${resumoAcertosHtml}','🏆 Oportunidades de premiação</div>${oportunidadesHtml}')
          s=s.replace('🏆 Oportunidades de premiação</div>${resumoAcertosHtml}','🏆 Oportunidades de premiação</div>${oportunidadesHtml}')
          s,nv=re.subn(r"const APP_VERSAO_ATUAL = '[^']+';", f"const APP_VERSAO_ATUAL = '{versao}';", s, count=1)
          if nv!=1: raise SystemExit('Versao index nao encontrada')
          p.write_text(s,encoding='utf-8')
          swp=Path('sw.js'); sw=swp.read_text(encoding='utf-8')
          sw,nw=re.subn(r"const CACHE_NAME = 'thor-loterias-[^']+';", f"const CACHE_NAME = 'thor-loterias-{versao}';", sw, count=1)
          if nw!=1: raise SystemExit('Versao sw nao encontrada')
          swp.write_text(sw,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar oportunidades de premiacao 2104"
          git pull --rebase origin main
          git push
