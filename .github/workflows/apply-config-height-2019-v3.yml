name: Apply config height 2019 v3
on:
  push:
    paths:
      - .github/workflows/apply-config-height-2019-v3.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python3 -c "from pathlib import Path; import re,base64; v='2026-09-11-2019'; b=base64.b64decode('').decode(); p=Path('index.html'); s=p.read_text(); s=re.sub(r'<style id=\"gfc-config-compact-height\">.*?</style>',b,s,count=1,flags=re.S) if 'gfc-config-compact-height' in s else s.replace('</head>','\n'+b+'\n</head>',1); s=re.sub(r\"const APP_VERSAO_ATUAL = '[^']+';\",f\"const APP_VERSAO_ATUAL = '{v}';\",s,count=1); p.write_text(s); q=Path('sw.js'); w=q.read_text(); w=re.sub(r\"const CACHE_NAME = 'thor-loterias-[^']+';\",f\"const CACHE_NAME = 'thor-loterias-{v}';\",w,count=1); q.write_text(w)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Compactar configuracoes e atualizar app 2019"
          git push
