name: Ajustar atualizacao automatica do app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar somente atualizacao do PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # NAO altera login, Firebase nem verificarTravaAparelho.
          s = s.replace("navigator.serviceWorker.register('sw.js', { updateViaCache:'none' })", "navigator.serviceWorker.register('./sw.js?v=202609111606', { updateViaCache:'none' })")
          s = re.sub(r"const APP_VERSAO_ATUAL = '[^']+';", "const APP_VERSAO_ATUAL = '2026-09-11-1606';", s, count=1)

          p.write_text(s, encoding='utf-8')
          # Mantem os dois enderecos HTML sincronizados para atalhos antigos.
          Path('THOR-LOTERIAS.html').write_text(s, encoding='utf-8')

          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = '[^']+';", "const CACHE_NAME = 'thor-loterias-2026-09-11-1606';", sw, count=1)
          if "'./THOR-LOTERIAS.html'" not in sw:
              sw = sw.replace("  './index.html',", "  './index.html',\n  './THOR-LOTERIAS.html',", 1)
          swp.write_text(sw, encoding='utf-8')
          PY
      - name: Commit da atualizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html THOR-LOTERIAS.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Forca atualizacao imediata do app mantendo trava de seguranca"
          git push
