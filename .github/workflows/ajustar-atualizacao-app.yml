name: Corrigir codigo visivel no app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajuste atual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          versao = '2026-09-11-1953'
          css_b64 = ''
          novo_bloco = base64.b64decode(css_b64).decode('utf-8')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'<style id="gerador-cards-resultado-finos">.*?</style>', novo_bloco, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Bloco de cards não encontrado')
          s = re.sub(r"const APP_VERSAO_ATUAL = '[^']+';", f"const APP_VERSAO_ATUAL = '{versao}';", s, count=1)
          p.write_text(s, encoding='utf-8')
          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = 'thor-loterias-[^']+';", f"const CACHE_NAME = 'thor-loterias-{versao}';", sw, count=1)
          swp.write_text(sw, encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Diminuir quadros de resultado e atualizar app 1953"
          git pull --rebase origin main
          git push
