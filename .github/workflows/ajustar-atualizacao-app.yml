name: Conferidor premios 2054
on:
  push:
    paths: ['.github/workflows/ajustar-atualizacao-app.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=s.replace("const GERADOR_APOSTA_SIZE = {MS:6, LF:15, QN:5, DIA:7, TM:10, DS:6};","const GERADOR_APOSTA_SIZE = {MS:6, LF:15, QN:5, DIA:7, LM:50, TM:10, DS:6};",1)
          s=s.replace("  LF:  [{h:15,label:'15 pontos'},   {h:14,label:'14 pontos'},  {h:13,label:'13 pontos'}, {h:12,label:'12 pontos'}, {h:11,label:'11 pontos'}],","  LF:  [{h:15,label:'15 pontos'},   {h:14,label:'14 pontos'},  {h:13,label:'13 pontos — R$ 35,00'}, {h:12,label:'12 pontos — R$ 14,00'}, {h:11,label:'11 pontos — R$ 7,00'}],",1)
          s=s.replace("  DIA: [{h:7, label:'7 acertos'},   {h:6, label:'6 acertos'},  {h:5, label:'5 acertos'}, {h:4, label:'4 acertos'}],","  DIA: [{h:7, label:'7 acertos'},   {h:6, label:'6 acertos'},  {h:5, label:'5 acertos'}, {h:4, label:'4 acertos'}],\n  LM:  [{h:20,label:'20 acertos'}, {h:19,label:'19 acertos'}, {h:18,label:'18 acertos'}, {h:17,label:'17 acertos'}, {h:16,label:'16 acertos'}, {h:15,label:'15 acertos'}, {h:0,label:'0 acertos'}],",1)
          s=s.replace("  TM:  [{h:7, label:'7 acertos'},   {h:6, label:'6 acertos'},  {h:5, label:'5 acertos'}, {h:4, label:'4 acertos'}, {h:3, label:'3 acertos'}],","  TM:  [{h:7, label:'7 acertos'},   {h:6, label:'6 acertos'},  {h:5, label:'5 acertos'}, {h:4, label:'4 acertos — R$ 10,50'}, {h:3, label:'3 acertos — R$ 3,50'}],",1)
          marker="function faixaPremioGerador(code, hits){\n  const faixas = FAIXAS_PREMIACAO_GERADOR[code];\n  if(!faixas) return null;\n  return faixas.find(f => f.h === hits) || null;\n}\n"
          if 'function resumoPremiacaoGerador' not in s:s=s.replace(marker,marker+base64.b64decode('').decode(),1)
          s=re.sub(r"    const badge = conferindo\n      \? `<span style=\"font-family:'Baloo 2'.*?      : '';",base64.b64decode('').decode(),s,count=1,flags=re.S)
          needle='  out.innerHTML = `\n    <div style="display:flex;gap:8px;margin-bottom:12px;">'
          s=s.replace(needle,base64.b64decode('').decode(),1)
          s=re.sub(r"const APP_VERSAO_ATUAL = '[^']+';","const APP_VERSAO_ATUAL = '2026-09-11-2054';",s,count=1)
          p.write_text(s,encoding='utf-8')
          q=Path('sw.js');x=q.read_text(encoding='utf-8');x=re.sub(r"const CACHE_NAME = 'thor-loterias-[^']+';","const CACHE_NAME = 'thor-loterias-2026-09-11-2054';",x,count=1);q.write_text(x,encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar conferidor de premios 2054"
          git pull --rebase origin main
          git push
