name: Aplicar diagnostico de filtros incompatíveis

on:
  push:
    paths:
      - '.github/workflows/apply-filter-diagnostic.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index e sw
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function renderGeradorAnalise(g, ultimo, anterior, repMedia, faixaMin, faixaMax, quentes, atrasados){"
          helper="""function diagnosticarFiltrosIncompativeis(min, max, dezenasPorJogo, ultimoSet, repetidasAlvo, filtroPares, filtroImpares, filtroPrimos, filtrosExtra){
            const ativos = [
              {chave:'pares', label:'Pares', valor:filtroPares},
              {chave:'impares', label:'Ímpares', valor:filtroImpares},
              {chave:'primos', label:'Primos', valor:filtroPrimos},
              {chave:'fib', label:'Fibonacci', valor:filtrosExtra.fib},
              {chave:'moldura', label:'Moldura', valor:filtrosExtra.moldura},
              {chave:'centro', label:'Centro', valor:filtrosExtra.centro},
              {chave:'mult3', label:'Múlt. de 3', valor:filtrosExtra.mult3},
              {chave:'soma', label:'Soma', valor:filtrosExtra.soma}
            ].filter(f=>f.valor!==null && f.valor!==undefined);

            if(!ativos.length) return [];

            if(filtroPares!==null && filtroImpares!==null && filtroPares + filtroImpares !== dezenasPorJogo){
              return ativos.filter(f=>f.chave==='pares' || f.chave==='impares');
            }

            function consegueSem(chaveRemovida){
              let pares = filtroPares, impares = filtroImpares, primos = filtroPrimos;
              const extra = {...filtrosExtra};
              if(chaveRemovida==='pares') pares = null;
              else if(chaveRemovida==='impares') impares = null;
              else if(chaveRemovida==='primos') primos = null;
              else extra[chaveRemovida] = null;

              for(let i=0;i<24;i++){
                if(gerarJogoPersonalizado(min, max, dezenasPorJogo, ultimoSet, repetidasAlvo, pares, impares, primos, extra)) return true;
              }
              return false;
            }

            const conflitos = ativos.filter(f=>consegueSem(f.chave));
            return conflitos.length ? conflitos : ativos;
          }

          function renderGeradorAnalise(g, ultimo, anterior, repMedia, faixaMin, faixaMax, quentes, atrasados){"""
          if 'function diagnosticarFiltrosIncompativeis(' not in s:
              if old not in s: raise SystemExit('Âncora do diagnóstico não encontrada')
              s=s.replace(old,helper,1)

          if 'Filtros que não estão combinando:' not in s:
              inicio=s.find('    if(jogos.length === 0){')
              fim=s.find('    geradorUltimoJogosCtx =', inicio)
              if inicio < 0 or fim < 0: raise SystemExit('Bloco de erro não encontrado')
              novo='''    if(jogos.length === 0){
              const conflitos = diagnosticarFiltrosIncompativeis(
                min, max, dezenasPorJogo, ultimoSet, repetidasAlvo,
                filtroPares, filtroImpares, filtroPrimos, filtrosExtra
              );
              if(conflitos.length){
                const lista = conflitos.map(f=>`<div style="margin-top:5px;"><strong>${f.label}:</strong> ${f.valor}</div>`).join('');
                out.innerHTML = `<div class="res-error">Não foi possível combinar esses filtros.<br><br><strong>Filtros que não estão combinando:</strong>${lista}<br><br><span style="font-size:12px;opacity:.85;">Altere pelo menos um dos filtros acima e toque em GERAR novamente.</span></div>`;
              }else{
                out.innerHTML = `<div class="res-error">Não foi possível gerar jogos com essa configuração de dezenas repetidas. Ajuste a quantidade de repetidas e toque em GERAR novamente.</div>`;
              }
              return;
            }

          '''
              s=s[:inicio]+novo+s[fim:]

          s=s.replace("const APP_VERSAO_ATUAL = '2026-09-11-1900';", "const APP_VERSAO_ATUAL = '2026-09-11-1909';",1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=t.replace("const CACHE_NAME = 'thor-loterias-2026-09-11-1900';", "const CACHE_NAME = 'thor-loterias-2026-09-11-1909';",1)
          sw.write_text(t,encoding='utf-8')
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Mostra filtros incompatíveis no gerador"
          git push
