name: Atualizar resultados das loterias
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atualizar-resultados.yml'
      - '.github/scripts/atualizar-historico.py'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: thor-resultados-atualizacao
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar resultados oficiais da CAIXA
        shell: python
        run: |
          import json, urllib.request, datetime, pathlib, time
          p=pathlib.Path("resultados-atualizados.json")
          try: base=json.loads(p.read_text(encoding="utf-8"))
          except: base={"resultados":{}}
          jogos=["megasena","lotofacil","quina","diadesorte","lotomania","supersete","timemania","duplasena"]
          out=dict(base.get("resultados",{}))
          for slug in jogos:
              url=f"https://servicebus2.caixa.gov.br/portaldeloterias/api/{slug}?_={int(time.time()*1000)}"
              req=urllib.request.Request(url,headers={"Accept":"application/json","Origin":"https://loterias.caixa.gov.br","Referer":"https://loterias.caixa.gov.br/","User-Agent":"Mozilla/5.0"})
              d=None
              erro=None
              for tentativa in range(1,5):
                  try:
                      req=urllib.request.Request(url+f"&tentativa={tentativa}",headers={"Accept":"application/json","Origin":"https://loterias.caixa.gov.br","Referer":"https://loterias.caixa.gov.br/","User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=25) as r: d=json.load(r)
                      break
                  except Exception as e:
                      erro=e
                      print(slug, f"tentativa {tentativa}/4 falhou:", e)
                      time.sleep(tentativa*3)
              # O endpoint sem número pode ficar atrasado; confira os próximos
              # concursos diretamente antes de publicar a base.
              atual=max(int((d or {}).get("numero") or 0), int(out.get(slug,{}).get("concurso",0)))
              for proximo in range(atual+1, atual+4):
                  try:
                      req=urllib.request.Request(f"https://servicebus2.caixa.gov.br/portaldeloterias/api/{slug}/{proximo}",headers={"Accept":"application/json","User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=15) as r: candidato=json.load(r)
                      if int(candidato.get("numero") or 0)!=proximo or not candidato.get("listaDezenas"): break
                      d=candidato
                      print(slug,"concurso atualizado pela consulta numerada:",proximo)
                  except Exception:
                      break
              if d:
                  nums=d.get("listaDezenas") or d.get("dezenas") or d.get("numeros") or []
                  n=d.get("numero") or d.get("concurso") or d.get("numeroConcurso")
                  if n and nums:
                      item={"concurso":int(n),"data":d.get("dataApuracao") or d.get("data") or "","dezenas":[int(x) for x in nums]}
                      seg=d.get("listaDezenasSegundoSorteio") or []
                      if seg: item["dezenasSegundoSorteio"]=[int(x) for x in seg]
                      if slug=="diadesorte" and d.get("nomeTimeCoracaoMesSorte"): item["mesSorte"]=d["nomeTimeCoracaoMesSorte"]
                      if slug=="timemania" and d.get("nomeTimeCoracaoMesSorte"): item["timeCoracao"]=d["nomeTimeCoracaoMesSorte"]
                      if int(item["concurso"]) >= int(out.get(slug,{}).get("concurso",0)): out[slug]=item
              else:
                  print(slug, "CAIXA indisponível após 4 tentativas; será tentado novamente na próxima execução:", erro)
          doc={"atualizadoEm":datetime.datetime.now(datetime.timezone.utc).isoformat(),"fonte":"API oficial Loterias CAIXA","resultados":out}
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
      - name: Atualizar histórico real de até 100 concursos por loteria
        run: python .github/scripts/atualizar-historico.py
      - name: Publicar se mudou
        shell: python
        run: |
          import json, pathlib, subprocess, time
          def git(*args,check=True):
              return subprocess.run(["git",*args],check=check).returncode
          files=["resultados-atualizados.json","historico-loterias.json"]
          generated={name:json.loads(pathlib.Path(name).read_text(encoding="utf-8")) for name in files}
          git("config","user.name","thor-resultados-bot")
          git("config","user.email","actions@users.noreply.github.com")
          git("restore","--",*files)
          for attempt in range(4):
              git("pull","--ff-only","origin","main")
              for name in files:
                  current=json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
                  incoming=generated[name]
                  if name=="resultados-atualizados.json":
                      for slug,item in incoming.get("resultados",{}).items():
                          if int(item.get("concurso",0))>=int(current.get("resultados",{}).get(slug,{}).get("concurso",0)):
                              current.setdefault("resultados",{})[slug]=item
                      current["atualizadoEm"]=max(current.get("atualizadoEm",""),incoming.get("atualizadoEm",""))
                  else:
                      # O histórico gerado já usa o resultado numerado da mesma execução.
                      # Preserve a versão remota se ela foi alterada por outro processo.
                      if current.get("atualizadoEm","")<=incoming.get("atualizadoEm",""):
                          current=incoming
                  pathlib.Path(name).write_text(json.dumps(current,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              git("add",*files)
              if git("diff","--cached","--quiet",check=False)==0:
                  break
              git("commit","-m","Atualiza resultados das loterias")
              if git("push","origin","HEAD:main",check=False)==0:
                  break
              # Desfaz somente o commit criado acima nesta execução isolada e tenta
              # mesclar de novo com a versão remota; nunca força o push.
              git("reset","--mixed","HEAD~1")
              git("restore","--",*files)
              if attempt==3: raise RuntimeError("Publicação concorrente; tentativas esgotadas")
              time.sleep(2)
