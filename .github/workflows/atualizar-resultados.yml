name: Atualizar resultados das loterias
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atualizar-resultados.yml'
      - '.github/scripts/atualizar-historico.py'
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: thor-resultados-atualizacao
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar resultados oficiais da CAIXA
        shell: python
        run: |
          import concurrent.futures, json, urllib.request, datetime, pathlib, time
          p=pathlib.Path("resultados-atualizados.json")
          try: base=json.loads(p.read_text(encoding="utf-8"))
          except: base={"resultados":{}}
          jogos=["megasena","lotofacil","quina","diadesorte","lotomania","supersete","timemania","duplasena"]
          out=dict(base.get("resultados",{}))
          def buscar_dia_de_sorte(anterior):
              meses = "Janeiro Fevereiro Março Abril Maio Junho Julho Agosto Setembro Outubro Novembro Dezembro".split()
              proximo = anterior + 1
              fontes = []
              for host in ("servicebus2", "servicebus3"):
                  raiz = f"https://{host}.caixa.gov.br/portaldeloterias/api/diadesorte"
                  fontes.extend([(raiz, None), (f"{raiz}/{proximo}", proximo)])
              espelho = "https://loteriascaixa-api.herokuapp.com/api/diadesorte"
              fontes.extend([(f"{espelho}/latest", None), (f"{espelho}/{proximo}", proximo)])

              def ler(fonte):
                  url, esperado = fonte
                  req = urllib.request.Request(f"{url}?_thor={time.time_ns()}", headers={"Accept":"application/json", "Cache-Control":"no-cache", "User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resposta:
                      dado = json.load(resposta)
                  numero = int(dado.get("numero") or dado.get("concurso") or 0)
                  if numero < anterior or (esperado is not None and numero != esperado):
                      return None
                  dezenas = sorted(int(x) for x in (dado.get("listaDezenas") or dado.get("dezenas") or []))
                  mes = str(dado.get("nomeTimeCoracaoMesSorte") or dado.get("mesSorte") or "").strip().capitalize()
                  data = dado.get("dataApuracao") or dado.get("data") or ""
                  datetime.datetime.strptime(data, "%d/%m/%Y")
                  if len(dezenas) != 7 or len(set(dezenas)) != 7 or not all(1 <= x <= 31 for x in dezenas) or mes not in meses:
                      return None
                  item = {"concurso":numero, "data":data, "dezenas":dezenas, "mesSorte":mes}
                  if url.startswith(espelho):
                      item["fonte"] = "API Loterias CAIXA (guto-alves)"
                  return item

              melhor = None
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(fontes)) as pool:
                  tarefas = [pool.submit(ler, fonte) for fonte in fontes]
                  for fonte, tarefa in zip(fontes, tarefas):
                      try:
                          item = tarefa.result()
                          if item and (not melhor or item["concurso"] > melhor["concurso"]):
                              melhor = item
                      except (OSError, ValueError, TypeError, KeyError) as erro:
                          print("Dia de Sorte:", fonte[0], erro)
              print("Dia de Sorte: último concurso completo recebido:", melhor and melhor["concurso"])
              return melhor
          def consultar(slug):
              if slug == "diadesorte":
                  return buscar_dia_de_sorte(int(out.get(slug, {}).get("concurso", 0)))
              url=f"https://servicebus3.caixa.gov.br/portaldeloterias/api/{slug}?_={int(time.time()*1000)}"
              req=urllib.request.Request(url,headers={"Accept":"application/json","Origin":"https://loterias.caixa.gov.br","Referer":"https://loterias.caixa.gov.br/","User-Agent":"Mozilla/5.0"})
              d=None
              erro=None
              for tentativa in range(1,5):
                  try:
                      req=urllib.request.Request((url if tentativa%2 else url.replace("servicebus3","servicebus2"))+f"&tentativa={tentativa}",headers={"Accept":"application/json","Origin":"https://loterias.caixa.gov.br","Referer":"https://loterias.caixa.gov.br/","User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=25) as r: d=json.load(r)
                      break
                  except Exception as e:
                      erro=e
                      print(slug, f"tentativa {tentativa}/4 falhou:", e)
                      time.sleep(tentativa*3)
              # O endpoint sem número pode ficar atrasado; confira os próximos
              # concursos diretamente antes de publicar a base.
              atual=max(int((d or {}).get("numero") or 0), int(out.get(slug,{}).get("concurso",0)))
              for proximo in range(atual+1, atual+4):
                  try:
                      req=urllib.request.Request(f"https://servicebus3.caixa.gov.br/portaldeloterias/api/{slug}/{proximo}?_thor={int(time.time()*1000)}",headers={"Accept":"application/json","User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                      try:
                          with urllib.request.urlopen(req,timeout=15) as r: candidato=json.load(r)
                      except Exception:
                          req=urllib.request.Request(req.full_url.replace("servicebus3","servicebus2"),headers=dict(req.headers))
                          with urllib.request.urlopen(req,timeout=15) as r: candidato=json.load(r)
                      if int(candidato.get("numero") or 0)!=proximo or not candidato.get("listaDezenas"): break
                      d=candidato
                      print(slug,"concurso atualizado pela consulta numerada:",proximo)
                  except Exception:
                      break
              if d:
                  nums=d.get("listaDezenas") or d.get("dezenas") or d.get("numeros") or []
                  n=d.get("numero") or d.get("concurso") or d.get("numeroConcurso")
                  if n and nums:
                      item={"concurso":int(n),"data":d.get("dataApuracao") or d.get("data") or "","dezenas":[int(x) for x in nums]}
                      seg=d.get("listaDezenasSegundoSorteio") or []
                      if seg: item["dezenasSegundoSorteio"]=[int(x) for x in seg]
                      if slug=="diadesorte" and d.get("nomeTimeCoracaoMesSorte"): item["mesSorte"]=d["nomeTimeCoracaoMesSorte"]
                      if slug=="timemania" and d.get("nomeTimeCoracaoMesSorte"): item["timeCoracao"]=d["nomeTimeCoracaoMesSorte"]
                      if int(item["concurso"]) >= int(out.get(slug,{}).get("concurso",0)):
                          return item
              else:
                  print(slug, "CAIXA indisponível após 4 tentativas; será tentado novamente na próxima execução:", erro)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              pendentes = {pool.submit(consultar, slug): slug for slug in jogos}
              for tarefa in concurrent.futures.as_completed(pendentes):
                  slug = pendentes[tarefa]
                  try:
                      item = tarefa.result()
                      if item: out[slug] = item
                  except Exception as erro:
                      print(slug, "resultado indisponível:", erro)
          doc={"atualizadoEm":datetime.datetime.now(datetime.timezone.utc).isoformat(),"fonte":"API oficial Loterias CAIXA","resultados":out}
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
      - name: Publicar resultados da rodada
        shell: python
        env:
          ARQUIVO: resultados-atualizados.json
        run: &publicar |
          import json, os, pathlib, subprocess, time
          def git(*args,check=True):
              return subprocess.run(["git",*args],check=check).returncode
          files=[os.environ["ARQUIVO"]]
          generated={name:json.loads(pathlib.Path(name).read_text(encoding="utf-8")) for name in files}
          git("config","user.name","thor-resultados-bot")
          git("config","user.email","actions@users.noreply.github.com")
          git("restore","--",*files)
          for attempt in range(4):
              git("pull","--ff-only","origin","main")
              for name in files:
                  current=json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
                  incoming=generated[name]
                  if name=="resultados-atualizados.json":
                      for slug,item in incoming.get("resultados",{}).items():
                          if int(item.get("concurso",0))>=int(current.get("resultados",{}).get(slug,{}).get("concurso",0)):
                              current.setdefault("resultados",{})[slug]=item
                      if current.get("resultados")==json.loads(pathlib.Path(name).read_text())["resultados"]:
                          continue
                      current["atualizadoEm"]=max(current.get("atualizadoEm",""),incoming.get("atualizadoEm",""))
                  else:
                      # O histórico gerado já usa o resultado numerado da mesma execução.
                      # Preserve a versão remota se ela foi alterada por outro processo.
                      if current.get("loterias")!=incoming.get("loterias") and current.get("atualizadoEm","")<=incoming.get("atualizadoEm",""):
                          current=incoming
                  pathlib.Path(name).write_text(json.dumps(current,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              git("add",*files)
              if git("diff","--cached","--quiet",check=False)==0:
                  break
              git("commit","-m","Atualiza resultados das loterias")
              if git("push","origin","HEAD:main",check=False)==0:
                  break
              # Desfaz somente o commit criado acima nesta execução isolada e tenta
              # mesclar de novo com a versão remota; nunca força o push.
              git("reset","--mixed","HEAD~1")
              git("restore","--",*files)
              if attempt==3: raise RuntimeError("Publicação concorrente; tentativas esgotadas")
              time.sleep(2)

      - name: Atualizar histórico real de até 100 concursos por loteria
        run: python .github/scripts/atualizar-historico.py
      - name: Publicar histórico
        shell: python
        env:
          ARQUIVO: historico-loterias.json
        run: *publicar
