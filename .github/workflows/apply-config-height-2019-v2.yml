name: Aplicar altura compacta 2019 v2

on:
  push:
    paths:
      - '.github/workflows/apply-config-height-2019-v2.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajuste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          versao = '2026-09-11-2019'
          css_b64 = ''
          bloco = base64.b64decode(css_b64).decode('utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="gfc-config-compact-height"' in s:
              s = re.sub(r'<style id="gfc-config-compact-height">.*?</style>', bloco, s, count=1, flags=re.S)
          else:
              s = s.replace('</head>', '\n' + bloco + '\n</head>', 1)
          s = re.sub(r"const APP_VERSAO_ATUAL = '[^']+';", f"const APP_VERSAO_ATUAL = '{versao}';", s, count=1)
          p.write_text(s, encoding='utf-8')

          swp = Path('sw.js')
          sw = swp.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = 'thor-loterias-[^']+';", f"const CACHE_NAME = 'thor-loterias-{versao}';", sw, count=1)
          swp.write_text(sw, encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Diminuir altura configuracoes e atualizar app 2019"
          git push
