name: Publicar oportunidades 2107
on:
  push:
    paths:
      - '.github/workflows/publicar-oportunidades-2107.yml'
      - '.github/scripts/patch-oportunidades-2107.py'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch
        run: python3 .github/scripts/patch-oportunidades-2107.py
      - name: Publicar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Oportunidades por faixa 2107"
          git pull --rebase origin main
          git push
