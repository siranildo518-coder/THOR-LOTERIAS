name: Corrigir banner da home
on:
  push:
    paths:
      - '.github/workflows/decode-home-banner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair imagem e corrigir CSS
        shell: python
        run: |
          import re, base64
          from pathlib import Path
          p=Path('home-banner.css')
          css=p.read_text(encoding='utf-8')
          m=re.search(r'data:image/jpeg;base64,([^"\)]+)', css)
          if not m:
              raise SystemExit('Imagem base64 nao encontrada')
          Path('home-banner.jpg').write_bytes(base64.b64decode(m.group(1)))
          css=re.sub(r'url\("data:image/jpeg;base64,[^"\)]+"\)', 'url("./home-banner.jpg?v=56")', css)
          p.write_text(css, encoding='utf-8')
      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-banner.jpg home-banner.css
          git commit -m "Converte banner da home em arquivo de imagem" || exit 0
          git push
