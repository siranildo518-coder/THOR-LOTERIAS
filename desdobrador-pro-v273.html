/* V114: foto cobre todo o cartão, sem faixa lisa e sem distorção. */
.lotteryGridPanel:before{background-size:cover!important;background-position:center top!important;background-repeat:no-repeat!important}

/* V115: remove o título textual da grade, preservando o contador. */
.lotteryGridPanel .gridHeading #title{display:none!important}

/* V117: fundo aprovado no primeiro quadro e sem divisor da redução. */
#firstSelectionPanel{background-image:none!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;overflow:hidden}
#firstSelectionPanel .combinationControls>label,#firstSelectionPanel #firstCount{color:#102719;text-shadow:0 1px 1px #ffffffa0}
#firstSelectionPanel .reduction>label{color:#fff;text-shadow:0 1px 2px #113d18}
#firstSelectionPanel .reduction{border-top:0!important}

/* V118: moldura metálica no primeiro quadro verde. */
#firstSelectionPanel{border:2px solid #b8c3c7!important;border-top-color:#f4f7f8!important;border-left-color:#dbe3e6!important;border-right-color:#78868d!important;border-bottom-color:#65737b!important;box-shadow:inset 0 0 0 1px #35444c,inset 0 0 0 3px #d2dbdf,inset 0 0 0 4px #6a7981,0 2px 3px #0008!important}

.selectionPanel .combinationControls>label,.selectionPanel #firstCount,.selectionPanel #secondCount{color:#17201b;text-shadow:0 1px 1px #ffffffa0}
.selectionPanel .reduction>label{color:#fff;text-shadow:0 1px 2px #102419}
.selectionPanel .reduction{border-top:0!important}
.selectionPanel.collapsed .selectionArtwork{display:block!important}

/* V121: títulos personalizados e contornos metálicos dos botões grandes. */
.selectionPanel .selectionHead h2{color:#fff!important;border:1px solid #d8e2e7;border-radius:5px;padding:3px 5px!important;text-shadow:0 1px 2px #000;font-size:11px!important;line-height:1.2;box-shadow:inset 0 1px 0 #ffffff30}
.selectionPanel .panelPlay,.selectionPanel .combinationControls>button,.selectionPanel .modeActions>.modeButton,.selectionPanel .splitButtonGroup>.modeButton{border:2px solid #b9c5cc!important;border-top-color:#f4f7fa!important;border-left-color:#dfe7eb!important;border-right-color:#71818a!important;border-bottom-color:#596b75!important;box-shadow:inset 0 0 0 1px #344750,0 0 0 1px #1c2b32,0 2px 2px #0007!important}

/* V122: dois quadros compactos e controles centralizados. */
.selectionPanel{padding:6px 8px!important;margin:5px 0!important}
.selectionPanel .selectionHead{gap:4px!important;margin-bottom:4px!important;align-items:center!important}
.selectionPanel .selectionHead h2{color:#13251a!important;background:linear-gradient(#e2f5db,#a5d5a0)!important;border:1px solid #fff!important;border-radius:4px!important;padding:2px 4px!important;font-size:10px!important;line-height:1.15!important;text-shadow:none!important;text-align:center;box-shadow:0 1px 1px #0003!important}
.selectionPanel .selectionHead>span{font-size:9px!important;white-space:nowrap}
.selectionPanel .panelCollapseArrow{height:21px!important;min-height:21px!important;width:22px!important;padding:0!important;font-size:15px!important}
.selectionPanel .selectionBody{gap:5px!important;grid-template-columns:minmax(0,1fr) 104px!important}
.selectionPanel .slotArea{gap:5px!important;justify-content:center}
.selectionPanel .slotArea .slots{grid-template-columns:repeat(6,22px)!important;gap:2px!important;margin-left:0!important;justify-content:center!important}
.selectionPanel .slots button{width:22px!important;height:22px!important;min-height:22px!important;padding:0!important;border-radius:4px!important;font-size:10px!important}
.selectionPanel .panelPlay{width:29px!important;flex-basis:29px!important;height:37px!important;min-height:37px!important;padding:2px!important;border-radius:5px!important;font-size:15px!important}
.selectionPanel .panelPlay small{font-size:8px!important}
.selectionPanel .combinationControls{gap:3px!important}
.selectionPanel .combinationControls>button{padding:3px!important;min-height:30px!important;font-size:9px!important;line-height:1.15!important;border-radius:5px!important}
.selectionPanel .combinationControls label{font-size:9px!important}
.selectionPanel .combinationControls input{height:24px!important;min-height:24px!important;padding:3px 5px!important;margin-top:2px!important;font-size:11px!important}
.selectionPanel .modeActions{gap:5px!important;margin-top:1px!important}
.selectionPanel .modeButton{height:25px!important;min-height:25px!important;padding:2px 4px!important;border-radius:5px!important;font-size:10px!important}
.selectionPanel .modeButton svg{height:12px!important;width:12px!important}
.selectionPanel .splitOptions{gap:4px!important;margin-top:3px!important}
.selectionPanel .splitOptions button{height:19px!important;min-height:19px!important;padding:1px 3px!important;font-size:9px!important;border-radius:4px!important}
.selectionPanel .reduction{padding-top:3px!important;margin-top:3px!important;justify-content:center!important}
.selectionPanel .reduction label{font-size:10px!important}
.selectionPanel .reduction select{height:25px!important;min-height:25px!important;padding:3px 6px!important;font-size:10px!important}
@media(max-width:350px){.selectionPanel .selectionBody{grid-template-columns:minmax(0,1fr) 87px!important}.selectionPanel .slotArea .slots{grid-template-columns:repeat(6,20px)!important}.selectionPanel .slots button{width:20px!important;height:20px!important;min-height:20px!important}.selectionPanel .selectionHead h2{font-size:9px!important}}

/* V123: segundo quadro termina na redução. */
#secondSelectionPanel #extras,#secondSelectionPanel #notice{display:none!important}

/* V124: quinze posições em três linhas de cinco. */
.selectionPanel .slotArea{justify-content:space-between!important;gap:9px!important;width:100%}
.selectionPanel .slotArea .slots{grid-template-columns:repeat(5,22px)!important;gap:4px!important;margin-left:auto!important;margin-right:4px!important;justify-content:center!important}
.selectionPanel .panelPlay{margin-left:0!important;margin-right:auto!important}
@media(max-width:350px){.selectionPanel .slotArea{gap:5px!important}.selectionPanel .slotArea .slots{grid-template-columns:repeat(5,20px)!important;gap:3px!important;margin-right:0!important}}

/* V125: folga discreta nas laterais do celular. */
@media(max-width:600px){main>.panel{margin-left:8px!important;margin-right:8px!important}}

/* V126: loterias em fileira única, com deslize horizontal e cores próprias. */
.tabs{display:flex;flex-wrap:nowrap!important;overflow-x:auto;overflow-y:hidden;gap:6px!important;padding:3px 2px 5px;scrollbar-width:none;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto!important;min-width:92px;padding:6px 12px!important;white-space:nowrap;color:#fff!important;background:linear-gradient(#ffffff45,transparent 48%,#0005),var(--lottery-tab-color)!important;border-color:#e6edf0 #6d7b83 #46515a #c9d2d7!important;text-shadow:0 1px 2px #0009!important;box-shadow:inset 0 1px 1px #fff5,0 1px 2px #0007!important}
.tabs button:nth-child(1){--lottery-tab-color:#9425b0}
.tabs button:nth-child(2){--lottery-tab-color:#078544}
.tabs button:nth-child(3){--lottery-tab-color:#204daf}
.tabs button:nth-child(4){--lottery-tab-color:#d96508}
.tabs button:nth-child(5){--lottery-tab-color:#688a12}
.tabs button:nth-child(6){--lottery-tab-color:#c32230}
.tabs button:nth-child(7){--lottery-tab-color:#b88b08}
.tabs button:nth-child(8){--lottery-tab-color:#087969}
.tabs button.active{outline:2px solid #fff;outline-offset:-3px;box-shadow:inset 0 1px 2px #fff8,0 0 4px #fff5!important}

/* V128: mais folga entre Play e os quadradinhos. */
.selectionPanel .slotArea{gap:14px!important}
.selectionPanel .slotArea .slots{margin-right:0!important}
@media(max-width:350px){.selectionPanel .slotArea{gap:9px!important}}

/* V129: largura uniforme do topo até o último quadro. */
main>.panel,main>.stickyTop,main>#savedViewBar{box-sizing:border-box!important;width:calc(100% - 16px)!important;max-width:calc(100% - 16px)!important;margin-left:8px!important;margin-right:8px!important}
main>.stickyTop header,main>.stickyTop .tabs{box-sizing:border-box;max-width:100%}

/* V130: Play e quadradinhos próximos, sem espaço automático. */
.selectionPanel .slotArea{justify-content:flex-start!important;gap:8px!important}
.selectionPanel .panelPlay{margin-left:0!important;margin-right:0!important}
.selectionPanel .slotArea .slots{margin-left:0!important;margin-right:0!important;flex:none!important}
@media(max-width:350px){.selectionPanel .slotArea{gap:7px!important}}

/* V131: corrige as margens antigas específicas do gerador e conferidor. */
main>#generationControls,main>#topChecker,main>#firstSelectionPanel,main>#secondSelectionPanel,main>section.panel{box-sizing:border-box!important;width:calc(100% - 16px)!important;max-width:calc(100% - 16px)!important;margin-left:8px!important;margin-right:8px!important;left:auto!important;right:auto!important}

/* V132: ações pequenas e alinhadas abaixo dos quadradinhos. */
.selectionPanel .selectionBody .modeActions{grid-column:1/-1!important;display:flex!important;align-items:flex-start!important;justify-content:flex-start!important;gap:5px!important;margin-left:37px!important;width:auto!important;margin-top:3px!important}
.selectionPanel .modeActions>.modeButton,.selectionPanel .splitButtonGroup>.modeButton{flex:none!important;width:58px!important;min-width:58px!important;height:19px!important;min-height:19px!important;padding:1px 3px!important;font-size:9px!important;border-radius:4px!important;border-width:1px!important}
.selectionPanel .splitButtonGroup{flex:none!important;width:auto!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important}
.selectionPanel .splitOptions{display:flex!important;gap:5px!important;margin-top:4px!important}
.selectionPanel .splitOptions button{flex:none!important;width:58px!important;min-width:58px!important;height:19px!important;min-height:19px!important;padding:1px 3px!important;font-size:9px!important;border-radius:4px!important}
.selectionPanel .modeActions .icon{margin-right:2px!important}
.selectionPanel .modeActions svg{width:10px!important;height:10px!important}
@media(max-width:350px){.selectionPanel .selectionBody .modeActions{margin-left:36px!important}}

/* V133: grade e três ações com as mesmas bordas laterais. */
.selectionPanel .slotArea{min-width:0!important}
.selectionPanel .slotArea .slots{flex:1!important;width:calc(100% - 37px)!important;min-width:0!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important}
.selectionPanel .slots button{width:100%!important;max-width:none!important}
.selectionPanel .selectionBody .modeActions{grid-column:1!important;margin-left:37px!important;width:calc(100% - 37px)!important;gap:4px!important}
.selectionPanel .modeActions>.modeButton,.selectionPanel .modeActions>.splitButtonGroup{flex:1 1 0!important;width:0!important;min-width:0!important}
.selectionPanel .splitButtonGroup>.modeButton{width:100%!important;min-width:0!important;font-size:8px!important}
.selectionPanel .modeActions>.modeButton{width:100%!important;min-width:0!important;font-size:8px!important}
.selectionPanel .modeActions .icon{display:none!important}
@media(max-width:350px){.selectionPanel .slotArea .slots{width:calc(100% - 36px)!important}.selectionPanel .selectionBody .modeActions{margin-left:36px!important;width:calc(100% - 36px)!important}}

/* V134: loterias neutras; somente a tocada recebe cor e brilho. */
.tabs button{background:linear-gradient(#657079,#303940 48%,#151e25)!important;border:1px solid #d7e2e8!important;outline:none!important;box-shadow:inset 0 1px 1px #fff5,0 0 2px #f5fcff!important}
.tabs[data-touched="true"] button.active{background:linear-gradient(#ffffff45,transparent 48%,#0005),var(--lottery-tab-color)!important;border:1px solid #fff!important;outline:1px solid #f2fbff!important;outline-offset:1px!important;box-shadow:inset 0 1px 2px #fff8,0 0 5px #fff,0 0 10px #dbf5ffcc!important}

/* V135: células realmente quadradas, sem alterar o alinhamento lateral. */
.selectionPanel .slotArea .slots button{aspect-ratio:1/1!important;height:auto!important;min-height:0!important;width:100%!important;box-sizing:border-box!important;align-self:start!important;padding:0!important}

/* V136: quadradinhos mais baixos, mantendo proporção e alinhamento. */
.selectionPanel .slotArea .slots{flex:0 1 116px!important;width:116px!important;max-width:116px!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important}
.selectionPanel .selectionBody .modeActions{width:116px!important;max-width:calc(100% - 37px)!important}
@media(max-width:350px){.selectionPanel .slotArea .slots{flex-basis:111px!important;width:111px!important;max-width:111px!important}.selectionPanel .selectionBody .modeActions{width:111px!important;max-width:calc(100% - 36px)!important}}

/* V137: ações ligeiramente mais largas para acomodar os nomes. */
.selectionPanel .selectionBody .modeActions{width:156px!important;max-width:none!important;margin-left:29px!important;gap:4px!important}
.selectionPanel .modeActions>.modeButton,.selectionPanel .splitButtonGroup>.modeButton{font-size:8px!important;padding:1px 2px!important;white-space:nowrap!important}
@media(max-width:350px){.selectionPanel .selectionBody .modeActions{width:150px!important;margin-left:28px!important}}

/* V138: pequeno deslocamento da grade para a direita. */
.selectionPanel .slotArea .slots{position:relative;left:8px}

function syncReductionChoices(){for(const t of ['fails','pool']){const select=$(t==='fails'?'firstReduce':'reduce'),button=$('reduceChoice_'+t);button.textContent=select.value;button.disabled=select.disabled}}
let reductionChoiceTarget='fails';
function openReductionChoices(t){reductionChoiceTarget=t;const select=$(t==='fails'?'firstReduce':'reduce');if(select.disabled)return;const grid=$('reductionChoicesGrid');grid.replaceChildren();for(const option of select.options){const button=document.createElement('button');button.type='button';button.textContent=option.value;button.className=option.value===select.value?'active':'';button.setAttribute('aria-label',option.value+' dezenas');button.onclick=()=>{select.value=option.value;changeReduction(t);$('reductionChoicesDialog').close()};grid.append(button)}$('reductionChoicesDialog').showModal()}

let splitNoticeTimer;
function showSplitNotice(){clearTimeout(splitNoticeTimer);$('splitNotice').hidden=false;splitNoticeTimer=setTimeout(()=>{$('splitNotice').hidden=true},1500)}
