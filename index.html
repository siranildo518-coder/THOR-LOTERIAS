<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050708">
<title>THOR LOTERIAS</title>
<style>html,body{margin:0;min-height:100%;background:#030506;color:#fff;font-family:Arial,sans-serif}#thorBoot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030506;z-index:999999;color:#f2bd52;font-weight:800;letter-spacing:1px}.thorBootBox{text-align:center}.thorBootSpin{width:34px;height:34px;margin:0 auto 12px;border:3px solid #302616;border-top-color:#f2bd52;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="thorBoot"><div class="thorBootBox"><div class="thorBootSpin"></div>THOR LOTERIAS</div></div>
<script>
(function(){
  var VERSION='20260912-1925';
  fetch('./app-main.html?v='+VERSION,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(html){
      var css='<link rel="stylesheet" href="./home-reference.css?v='+VERSION+'">';
      var js='<script src="./home-reference.js?v='+VERSION+'">'+'</scr'+'ipt>';
      if(html.indexOf('home-reference.css')<0) html=html.replace('</head>',css+'\n</head>');
      if(html.indexOf('home-reference.js')<0) html=html.replace('</body>',js+'\n</body>');
      document.open();document.write(html);document.close();
    })
    .catch(function(err){
      var boot=document.getElementById('thorBoot');
      if(boot)boot.innerHTML='<div class="thorBootBox">Não foi possível carregar o app.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:9px;background:#f2bd52;color:#111;font-weight:800">TENTAR NOVAMENTE</button></div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
