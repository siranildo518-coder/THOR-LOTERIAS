<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>THOR LOTERIAS</title>
<style>
html,body{margin:0;min-height:100%;background:#07101f;color:#fff;font-family:Arial,sans-serif}
#thorBoot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101f;z-index:999999;color:#fff;font-weight:800;letter-spacing:1px}.thorBootBox{text-align:center}.thorBootSpin{width:34px;height:34px;margin:0 auto 12px;border:3px solid #243956;border-top-color:#8b2cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="thorBoot"><div class="thorBootBox"><div class="thorBootSpin"></div>THOR LOTERIAS</div></div>
<script>
(function(){
  var VERSION='20260912-fundo-neon-forte-02';
  fetch('./app-main.html?v='+VERSION,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(html){
      html = html.replace("      <div class=\"hh-row\">📅 Próximo sorteio: ${data.dataProxConcurso || '—'}</div>\n", "");
      html = html.replace("      <div class=\"hh-row\">🎟️ Concurso ${data.concurso + 1}</div>\n", "");
      html = html.replace("      <div class=\"hh-premio-lbl\">${data.acumulou ? 'ESTIMATIVA ACUMULADA' : 'PRÊMIO ESTIMADO'}</div>\n", "");
      html = html.replace("      <div class=\"hh-premio-val\">${formatBRL(data.acumuladaProxConcurso)}</div>\n", "");
      var MENU_PATCH = String.raw`<style id="thor-home-dinamica-final">
#overlayListaResultados{padding-left:0!important;background:radial-gradient(ellipse at 50% 42%,var(--page-color,#8B2FC9) 0%,var(--page-dark,#26113f) 32%,#07101f 72%)!important;transition:background .3s ease!important}
#homeSideNav{display:none!important}
#overlayListaResultados .home-topbar{position:relative!important}
#overlayListaResultados .home-topbar-left{width:100%!important;justify-content:center!important;position:relative!important}
#overlayListaResultados .home-icon-btn{display:none!important}
#overlayListaResultados #listaResultadosVoltar{display:flex!important;position:absolute!important;left:0!important;top:50%!important;transform:translateY(-50%)!important;width:42px!important;height:42px!important;align-items:center!important;justify-content:center!important;border-radius:12px!important;border:1px solid #346aa7!important;background:#111d33!important;color:#fff!important;box-shadow:0 0 12px rgba(52,133,255,.22)!important;z-index:20!important}
#overlayListaResultados .home-hero::before{content:none!important;display:none!important}
#overlayListaResultados .home-hero h2{display:block!important;margin:0 0 14px!important;font-size:clamp(28px,8vw,46px)!important;line-height:.95!important;color:#fff!important;text-transform:uppercase!important;font-style:italic!important;font-weight:1000!important;letter-spacing:-1.4px!important;text-shadow:0 3px 0 rgba(30,40,60,.9),0 0 16px var(--hero-color,#8B2FC9)!important}
#overlayListaResultados .home-hero{border:2px solid var(--hero-border,#C86BFF)!important;background:radial-gradient(ellipse at 50% 35%,var(--hero-color,#8B2FC9) 0%,var(--hero-mid,#3b155c) 40%,#08101f 88%)!important;box-shadow:inset 0 0 48px var(--hero-shadow,rgba(139,47,201,.55)),0 0 8px var(--hero-border,#C86BFF),0 0 28px var(--hero-shadow,rgba(139,47,201,.55))!important;transition:background .3s ease,border-color .3s ease,box-shadow .3s ease!important}
#overlayListaResultados .hh-ball{background:radial-gradient(circle at 30% 22%,#fff7c7 0%,#ffe27a 16%,#dca62d 43%,#8b5a08 76%,#3b2200 100%)!important;border:1px solid #ffd85a!important;color:#111!important;text-shadow:0 1px 0 rgba(255,255,255,.65)!important;box-shadow:inset 2px 2px 5px rgba(255,255,255,.72),inset -3px -4px 7px rgba(74,38,0,.55),0 2px 5px rgba(0,0,0,.48),0 0 8px rgba(255,190,35,.38)!important}
#overlayListaResultados .hh-stats-btn{background:linear-gradient(135deg,var(--hero-color,#8B2FC9),var(--hero-border,#C86BFF))!important;border-color:var(--hero-border,#C86BFF)!important}
#overlayListaResultados .home-tab.active{background:linear-gradient(135deg,var(--tab-color,#8B2FC9),var(--tab-border,#C86BFF))!important;border-color:var(--tab-light,#DDA8FF)!important;box-shadow:0 0 8px var(--tab-border,#C86BFF),0 0 20px var(--tab-color,#8B2FC9)!important}
#overlayListaResultados .thor-fechamento-compacto{min-height:74px!important;height:74px!important;max-height:74px!important;padding:7px 14px!important;box-sizing:border-box!important;overflow:hidden!important}
#overlayListaResultados .thor-fechamento-compacto button{min-height:40px!important;height:40px!important;padding-top:6px!important;padding-bottom:6px!important}
#overlayListaResultados .thor-fechamento-compacto img,#overlayListaResultados .thor-fechamento-compacto .icon,#overlayListaResultados .thor-fechamento-compacto [class*="icon"]{max-height:46px!important;max-width:46px!important}
@media(max-width:360px){#overlayListaResultados{padding-left:0!important}}
</style>`;
      var DYNAMIC_PATCH = String.raw`<script id="thor-loteria-dinamica-final">
(function(){
 const cores={
  'LOTOFÁCIL':['#8B2FC9','#C86BFF','#DDA8FF','#3b155c','#26113f','rgba(139,47,201,.62)'],
  'MEGA-SENA':['#00B85C','#28F18A','#B0FFD2','#07552e','#052b1c','rgba(0,210,105,.62)'],
  'MEGA SENA':['#00B85C','#28F18A','#B0FFD2','#07552e','#052b1c','rgba(0,210,105,.62)'],
  'QUINA':['#2369E8','#43A0FF','#C2DEFF','#102f70','#0b214d','rgba(35,105,232,.62)'],
  'DIA DE SORTE':['#E99522','#FFC257','#FFE1A8','#5c3510','#34200c','rgba(233,149,34,.62)'],
  'LOTOMANIA':['#EE7541','#FFAA70','#FFD0B3','#5c2915','#32180d','rgba(238,117,65,.62)'],
  'SUPER SETE':['#6830D8','#2794FF','#D0BCFF','#2c185f','#18123c','rgba(104,48,216,.62)'],
  'TIMEMANIA':['#E72867','#FF6098','#FFC2D7','#5a1531','#310d20','rgba(231,40,103,.62)'],
  '+MILIONÁRIA':['#175DA7','#3694F2','#C0DEFF','#12375d','#0a2039','rgba(23,93,167,.62)'],
  'DUPLA SENA':['#B92237','#F14D61','#FFC5CC','#51141d','#2d0d12','rgba(185,34,55,.62)']
 };
 function compactarFechamento(){const raiz=document.getElementById('overlayListaResultados');if(!raiz)return;const titulo=Array.from(raiz.querySelectorAll('*')).find(function(e){return e.children.length===0&&(e.textContent||'').trim()==='Fechamento personalizado'});if(!titulo)return;let p=titulo.parentElement;while(p&&p!==raiz){const btn=Array.from(p.querySelectorAll('button')).find(function(b){return (b.textContent||'').trim()==='Gerar'});if(btn){p.classList.add('thor-fechamento-compacto');break}p=p.parentElement}}
 function nomeAtivo(){const t=document.querySelector('#overlayListaResultados .home-tab.active');return t?(t.textContent||'').trim().toUpperCase():''}
 function aplicar(){compactarFechamento();const raiz=document.getElementById('overlayListaResultados');const hero=document.querySelector('#overlayListaResultados .home-hero');if(!hero||!raiz)return;const nome=nomeAtivo();if(!nome)return;const c=cores[nome]||cores['LOTOFÁCIL'];const h2=hero.querySelector('h2');if(h2)h2.textContent=nome;raiz.style.setProperty('--page-color',c[0]);raiz.style.setProperty('--page-dark',c[4]);hero.style.setProperty('--hero-color',c[0]);hero.style.setProperty('--hero-border',c[1]);hero.style.setProperty('--hero-mid',c[3]);hero.style.setProperty('--hero-shadow',c[5]);document.querySelectorAll('#overlayListaResultados .home-tab').forEach(function(t){if(t.classList.contains('active')){t.style.setProperty('--tab-color',c[0]);t.style.setProperty('--tab-border',c[1]);t.style.setProperty('--tab-light',c[2])}})}
 document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#overlayListaResultados .home-tab')){setTimeout(aplicar,20);setTimeout(aplicar,180)}},true);
 const obs=new MutationObserver(function(){requestAnimationFrame(aplicar)});function iniciar(){const r=document.getElementById('overlayListaResultados');if(r){obs.observe(r,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});aplicar()}else setTimeout(iniciar,100)}iniciar();
})();
<\/script>`;
      html = html.replace('</head>', MENU_PATCH + '\n</head>');
      html = html.replace('</body>', DYNAMIC_PATCH + '\n</body>');
      document.open();document.write(html);document.close();
    })
    .catch(function(err){var boot=document.getElementById('thorBoot');if(boot)boot.innerHTML='<div class="thorBootBox">Não foi possível carregar o app.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:9px;background:#7c21e8;color:#fff;font-weight:800">TENTAR NOVAMENTE</button></div>';console.error(err);});
})();
</script>
</body>
</html>
