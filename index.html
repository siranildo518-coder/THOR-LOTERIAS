<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#030405">
<title>THOR LOTERIAS</title>
<style>
html,body{margin:0;min-height:100%;background:#030405;color:#fff;font-family:Arial,sans-serif}
#thorBoot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030405;z-index:999999;color:#f2bd52;font-weight:800;letter-spacing:1px}
.thorBootBox{text-align:center}.thorBootSpin{width:34px;height:34px;margin:0 auto 12px;border:3px solid #302616;border-top-color:#f2bd52;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="thorBoot"><div class="thorBootBox"><div class="thorBootSpin"></div>THOR LOTERIAS</div></div>
<script>
(function(){
  var VERSION='20260912-crisp-home-01';
  var HOME_CSS = String.raw`
html.thor-home-open,body.thor-home-open{overflow:hidden!important;background:#000!important}
#thorExactHome{position:fixed;inset:0;z-index:2147483000;background:#020304;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#thorExactHome *{box-sizing:border-box}
#thorExactHome button{font:inherit}
#thorExactHome .thor-stage{position:relative;width:min(100%,480px);height:100svh;min-height:620px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#060708 0%,#020304 62%,#000 100%);box-shadow:0 0 34px #000}
#thorExactHome .thor-top{height:68px;display:grid;grid-template-columns:68px 1fr 86px;align-items:center;padding:4px 8px;border-bottom:1px solid rgba(218,166,56,.24);background:linear-gradient(180deg,#0b0d0e 0%,#050606 100%)}

#thorExactHome .hamb{font-size:31px;line-height:1;letter-spacing:-3px;padding-right:4px}

#thorExactHome .thor-logo-main{font-family:Arial Black,Impact,sans-serif;font-size:42px;font-weight:900;letter-spacing:-2px;background:linear-gradient(180deg,#fff 0%,#cfd0d1 42%,#f7f7f7 55%,#747474 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 3px 6px #000}
#thorExactHome .thor-logo-main b{font-weight:900;background:linear-gradient(180deg,#fff1a3,#f0a90f 55%,#7a4a00);-webkit-background-clip:text;background-clip:text;color:transparent}
#thorExactHome .thor-logo-sub{margin-top:3px;color:#d1a13c;font-weight:900;letter-spacing:5px;font-size:13px;text-shadow:0 2px 3px #000}

#thorExactHome .mini{width:38px;height:42px;border-radius:8px;font-size:18px;color:#caa24f}
#thorExactHome .thor-hero{position:relative;height:218px;overflow:hidden;border-bottom:1px solid rgba(218,166,56,.18);background:radial-gradient(circle at 68% 42%,rgba(255,194,45,.24) 0 8%,transparent 25%),radial-gradient(circle at 48% 98%,rgba(255,200,59,.20),transparent 35%),linear-gradient(115deg,#080a0b 0%,#11110e 50%,#2a1c06 73%,#0b0b0a 100%)}
#thorExactHome .thor-hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 42px,rgba(255,206,92,.025) 43px 44px),linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.58));pointer-events:none}
#thorExactHome .hero-left{position:absolute;z-index:2;left:19px;top:24px;width:55%}
#thorExactHome .hero-kicker{font-size:12px;color:#d2a448;font-weight:800;letter-spacing:1.8px}
#thorExactHome .hero-title{margin-top:5px;font-size:34px;font-family:Arial Black,Arial,sans-serif;line-height:1;color:#f5f5f5;text-shadow:0 3px 6px #000}
#thorExactHome .hero-sub{margin-top:8px;color:#c7c9ca;font-size:12px;line-height:1.35}
#thorExactHome .hero-prize{margin-top:9px;color:#f2bf4d;font-size:14px;font-weight:800}
#thorExactHome .trophy{position:absolute;z-index:1;right:27px;top:27px;width:103px;height:123px;filter:drop-shadow(0 10px 14px #000)}
#thorExactHome .cup{position:absolute;left:26px;top:5px;width:54px;height:63px;border-radius:10px 10px 28px 28px;background:linear-gradient(90deg,#8a5c06,#fbd66b 45%,#a26600 100%);box-shadow:inset 0 0 12px rgba(255,255,255,.36)}
#thorExactHome .cup:before,#thorExactHome .cup:after{content:"";position:absolute;top:10px;width:25px;height:33px;border:8px solid #d29c29;border-radius:50%}
#thorExactHome .cup:before{left:-22px;border-right:0}.cup:after{right:-22px;border-left:0}
#thorExactHome .stem{position:absolute;left:47px;top:64px;width:12px;height:25px;background:linear-gradient(90deg,#8a5c06,#fbd66b,#8a5c06)}
#thorExactHome .base{position:absolute;left:24px;top:86px;width:58px;height:13px;border-radius:4px;background:linear-gradient(180deg,#f2c552,#8e5b00)}
#thorExactHome .balls{position:absolute;z-index:3;right:10px;bottom:14px;display:flex;align-items:end;gap:4px}
#thorExactHome .ball{display:flex;align-items:center;justify-content:center;width:39px;height:39px;border-radius:50%;font-size:12px;font-weight:900;color:#151515;background:radial-gradient(circle at 32% 27%,#fff,#dcdcdc 48%,#989898 100%);border:1px solid #efefef;box-shadow:0 5px 9px #000}
#thorExactHome .ball:nth-child(2){width:46px;height:46px}.ball:nth-child(4){width:43px;height:43px}
#thorExactHome .thor-grid{display:grid;grid-template-columns:repeat(3,1fr);height:207px;border-bottom:1px solid rgba(255,255,255,.05)}
#thorExactHome .thor-card{position:relative;border:0;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 8px 8px 48px;text-align:left;color:#fff;cursor:pointer;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#thorExactHome .thor-card:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.09),transparent 42%,rgba(0,0,0,.17));pointer-events:none}
#thorExactHome .thor-card:active{filter:brightness(1.22)}
#thorExactHome .cardico{position:absolute;left:13px;top:17px;width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);box-shadow:inset 0 0 8px rgba(255,255,255,.11);font-size:16px;font-weight:900}
#thorExactHome .cardtitle{position:relative;display:block;font-size:12.5px;font-weight:900;line-height:1.12;margin-top:4px}
#thorExactHome .cardsub{position:relative;display:block;margin-top:4px;font-size:8.5px;color:rgba(255,255,255,.68);line-height:1.15}
#thorExactHome .c1{background:linear-gradient(130deg,#44116f,#6f1fc0)}#thorExactHome .c2{background:linear-gradient(130deg,#073b91,#116dde)}#thorExactHome .c3{background:linear-gradient(130deg,#006133,#008f54)}
#thorExactHome .c4{background:linear-gradient(130deg,#9a4300,#d46a00)}#thorExactHome .c5{background:linear-gradient(130deg,#a20d14,#dc2830)}#thorExactHome .c6{background:linear-gradient(130deg,#007484,#00a5b8)}
#thorExactHome .c7{background:linear-gradient(130deg,#a50058,#df0a79)}#thorExactHome .c8{background:linear-gradient(130deg,#3320a6,#542bc9)}#thorExactHome .c9{background:linear-gradient(130deg,#191a1d,#34373d)}
#thorExactHome .thor-result{height:62px;margin:8px 10px 0;border:1px solid rgba(214,171,73,.22);border-radius:9px;background:linear-gradient(100deg,#111211,#171717 55%,#0b0c0c);display:grid;grid-template-columns:110px 1fr 68px;align-items:center;padding:7px 9px;box-shadow:0 5px 12px rgba(0,0,0,.45);cursor:pointer}
#thorExactHome .res-label{font-size:9px;color:#c7a049;line-height:1.25;font-weight:800}.res-label b{display:block;color:#f3f3f3;font-size:11px;margin-bottom:2px}
#thorExactHome .res-balls{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:116px}
#thorExactHome .res-balls i{font-style:normal;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;background:linear-gradient(#dd9cff,#7f28aa);color:#fff;font-weight:800;box-shadow:0 1px 2px #000}
#thorExactHome .res-date{text-align:right;font-size:8px;color:#bbb}.res-date b{display:block;color:#e4b34d;font-size:10px}
#thorExactHome .thor-banner{height:58px;margin:7px 10px 0;border-radius:8px;border:1px solid rgba(132,187,231,.13);background:linear-gradient(100deg,#052535,#0c3142 62%,#3a2a13);position:relative;overflow:hidden;padding:11px 15px;color:#d7ecf5;box-shadow:0 5px 12px #000}
#thorExactHome .thor-banner:after{content:"";position:absolute;right:20px;top:-24px;width:95px;height:95px;border-radius:50%;background:radial-gradient(circle,#f4c35d 0 3%,rgba(244,195,93,.25) 4% 24%,transparent 55%)}
#thorExactHome .banner-title{font-size:11px;font-weight:900}.banner-sub{font-size:8.5px;margin-top:3px;color:#a7c3d0}
#thorExactHome .thor-bottom{position:absolute;left:8px;right:8px;bottom:max(7px,env(safe-area-inset-bottom));height:74px;border:1px solid rgba(214,171,73,.18);border-radius:13px;background:linear-gradient(180deg,rgba(16,18,20,.98),rgba(5,6,7,.98));display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -4px 17px rgba(0,0,0,.8);overflow:hidden}
#thorExactHome .navbtn{border:0;border-right:1px solid rgba(255,255,255,.035);background:transparent;color:#c3c5c7;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
#thorExactHome .navbtn b{font-size:21px;line-height:1;color:#f4f4f4}.navbtn.active{color:#e6bd65;background:linear-gradient(180deg,rgba(198,147,41,.18),transparent)}.navbtn.active b{color:#e6bd65}
@media(max-height:760px){#thorExactHome .thor-top{height:59px}.thor-logo-main{font-size:36px!important}#thorExactHome .thor-hero{height:190px}#thorExactHome .thor-grid{height:192px}#thorExactHome .thor-result{height:57px}#thorExactHome .thor-banner{display:none}}
`;
  var HOME_JS = String.raw`
(function(){
'use strict';
var HOME_ID='thorExactHome';
function q(id){return document.getElementById(id)}
function click(id){var e=q(id);if(e)e.click()}
function logged(){try{return localStorage.getItem('tl_login_ok_v1')==='1'}catch(e){return true}}
function lock(){document.documentElement.classList.add('thor-home-open');document.body.classList.add('thor-home-open')}
function unlock(){document.documentElement.classList.remove('thor-home-open');document.body.classList.remove('thor-home-open')}
function hide(){var r=q(HOME_ID);if(r)r.style.display='none';unlock()}
function show(){var r=q(HOME_ID);if(r&&logged()){r.style.display='block';lock()}}
function go(id){hide();setTimeout(function(){click(id)},20)}
function resultado(){hide();try{if(typeof openResultadoOverlay==='function')openResultadoOverlay(window.homeGameAtual||window.LOTOFACIL_GAME);else click('btnResultadosAtalho')}catch(e){}}
function drawer(){hide();try{if(typeof openDrawer==='function')openDrawer();else click('btnMenu')}catch(e){}}
function balls(){var a=['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15'];return a.map(function(n){return '<i>'+n+'</i>'}).join('')}
function makeHome(){
 if(!logged()||q(HOME_ID))return;
 var root=document.createElement('div');root.id=HOME_ID;
 root.innerHTML='<div class="thor-stage">'+
 '<header class="thor-top"><button class="thor-iconbtn hamb" id="thorMenu" aria-label="Menu">☰</button><div class="thor-logo"><div class="thor-logo-main">TH<b>⚡</b>R</div><div class="thor-logo-sub">LOTERIAS</div></div><div class="righticons"><button class="thor-iconbtn mini" id="thorResultadosTop">▦</button><button class="thor-iconbtn mini" id="thorConfigTop">⚙</button></div></header>'+
 '<section class="thor-hero"><div class="hero-left"><div class="hero-kicker">THOR LOTERIAS</div><div class="hero-title">LOTOFÁCIL</div><div class="hero-sub">Análises, combinações e ferramentas para seus jogos.</div><div class="hero-prize">RESULTADOS E ESTATÍSTICAS</div></div><div class="trophy"><div class="cup"></div><div class="stem"></div><div class="base"></div></div><div class="balls"><span class="ball">03</span><span class="ball">10</span><span class="ball">15</span><span class="ball">19</span></div></section>'+
 '<section class="thor-grid">'+
 '<button class="thor-card c1" id="thorAnalise"><span class="cardico">↗</span><span class="cardtitle">Análise</span><span class="cardsub">Frequência e tendências</span></button>'+
 '<button class="thor-card c2" id="thorComb"><span class="cardico">◉</span><span class="cardtitle">Combinações</span><span class="cardsub">Fechamentos e filtros</span></button>'+
 '<button class="thor-card c3" id="thorJogos"><span class="cardico">▶</span><span class="cardtitle">Jogos</span><span class="cardsub">Jogos salvos</span></button>'+
 '<button class="thor-card c4" id="thorCalc"><span class="cardico">▤</span><span class="cardtitle">Calculadora</span><span class="cardsub">Probabilidades</span></button>'+
 '<button class="thor-card c5" id="thorPalpites"><span class="cardico">⬟</span><span class="cardtitle">Palpites</span><span class="cardsub">Sugestões de jogos</span></button>'+
 '<button class="thor-card c6" id="thorResultados2"><span class="cardico">♛</span><span class="cardtitle">Resultados</span><span class="cardsub">Últimos concursos</span></button>'+
 '<button class="thor-card c7" id="thorSequencias"><span class="cardico">●</span><span class="cardtitle">Minhas Sequências</span><span class="cardsub">Sequências salvas</span></button>'+
 '<button class="thor-card c8" id="thorAnalisador"><span class="cardico">▥</span><span class="cardtitle">Analisador de Jogos</span><span class="cardsub">Confira seus jogos</span></button>'+
 '<button class="thor-card c9" id="thorConfig"><span class="cardico">⚙</span><span class="cardtitle">Configurações</span><span class="cardsub">Ajustes do aplicativo</span></button></section>'+
 '<button class="thor-result" id="thorResultados"><span class="res-label"><b>ÚLTIMO RESULTADO</b>LOTOFÁCIL</span><span class="res-balls">'+balls()+'</span><span class="res-date"><b>CONCURSO</b>ATUAL</span></button>'+
 '<div class="thor-banner"><div class="banner-title">THOR LOTERIAS • ANÁLISE COMPLETA</div><div class="banner-sub">Dados, tendências e ferramentas em um só lugar.</div></div>'+
 '<nav class="thor-bottom"><button class="navbtn active" id="thorInicio"><b>⌂</b>Início</button><button class="navbtn" id="thorNavAnalise"><b>◒</b>Análise</button><button class="navbtn" id="thorNavComb"><b>▦</b>Combinações</button><button class="navbtn" id="thorNavCalc"><b>∑</b>Calculadora</button><button class="navbtn" id="thorNavJogos"><b>★</b>Jogos</button></nav></div>';
 document.body.appendChild(root);lock();
 q('thorMenu').onclick=drawer;q('thorConfigTop').onclick=drawer;
 q('thorResultadosTop').onclick=resultado;
 q('thorAnalise').onclick=function(){go('btnTendenciaAtalho')};
 q('thorComb').onclick=function(){go('btnFechamentoAtalho')};
 q('thorJogos').onclick=function(){go('btnJogosSalvosAtalho2')};
 q('thorCalc').onclick=function(){go('btnSimularAtalho')};
 q('thorPalpites').onclick=function(){go('btnAbrirFechamentoAtalho')};
 q('thorResultados').onclick=resultado;q('thorResultados2').onclick=resultado;
 q('thorSequencias').onclick=function(){go('menuMinhasSequencias')};
 q('thorAnalisador').onclick=function(){go('menuAnalisadorJogos')};
 q('thorConfig').onclick=drawer;
 q('thorInicio').onclick=function(){show();try{if(typeof goHome==='function')goHome()}catch(e){}};
 q('thorNavAnalise').onclick=q('thorAnalise').onclick;q('thorNavComb').onclick=q('thorComb').onclick;q('thorNavCalc').onclick=q('thorCalc').onclick;q('thorNavJogos').onclick=q('thorJogos').onclick;
 var start=q('btnInicioAtalho');if(start)start.addEventListener('click',function(){setTimeout(show,0)},true);
 window.thorShowHome=show;
}
function start(){if(logged()){makeHome();return}var tries=0,t=setInterval(function(){if(logged()){clearInterval(t);makeHome()}else if(++tries>240)clearInterval(t)},500)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
`;
  fetch('./app-main.html?v='+VERSION,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(html){
      var style='<style id="thorExactHomeStyle">'+HOME_CSS+'</style>';
      var script='<script id="thorExactHomeScript">'+HOME_JS+'<\/script>';
      html=html.replace('</head>',style+'\n</head>');
      html=html.replace('</body>',script+'\n</body>');
      document.open();document.write(html);document.close();
    })
    .catch(function(err){
      var boot=document.getElementById('thorBoot');
      if(boot)boot.innerHTML='<div class="thorBootBox">Não foi possível carregar o app.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:9px;background:#f2bd52;color:#111;font-weight:800">TENTAR NOVAMENTE</button></div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
