<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>THOR LOTERIAS</title>
<style>
html,body{margin:0;min-height:100%;background:#07101f;color:#fff;font-family:Arial,sans-serif}
#thorBoot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101f;z-index:999999;color:#fff;font-weight:800;letter-spacing:1px}.thorBootBox{text-align:center}.thorBootSpin{width:34px;height:34px;margin:0 auto 12px;border:3px solid #243956;border-top-color:#8b2cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="thorBoot"><div class="thorBootBox"><div class="thorBootSpin"></div>THOR LOTERIAS</div></div>
<script>
(function(){
  var VERSION='20260912-home-salva-01';
  fetch('./app-main.html?v='+VERSION,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(html){
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      var boot=document.getElementById('thorBoot');
      if(boot)boot.innerHTML='<div class="thorBootBox">Não foi possível carregar o app.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:9px;background:#7c21e8;color:#fff;font-weight:800">TENTAR NOVAMENTE</button></div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
