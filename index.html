<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>THOR LOTERIAS</title>
<style>
html,body{margin:0;min-height:100%;background:#07101f;color:#fff;font-family:Arial,sans-serif}
#thorBoot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101f;z-index:999999;color:#fff;font-weight:800;letter-spacing:1px}.thorBootBox{text-align:center}.thorBootSpin{width:34px;height:34px;margin:0 auto 12px;border:3px solid #243956;border-top-color:#8b2cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="thorBoot"><div class="thorBootBox"><div class="thorBootSpin"></div>THOR LOTERIAS</div></div>
<script>
(function(){
 var VERSION='20260912-cor-nativa-loteria-05';
 fetch('./app-main.html?v='+VERSION,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(html){
  html=html.replace("      <div class=\"hh-row\">📅 Próximo sorteio: ${data.dataProxConcurso || '—'}</div>\n","");
  html=html.replace("      <div class=\"hh-row\">🎟️ Concurso ${data.concurso + 1}</div>\n","");
  html=html.replace("      <div class=\"hh-premio-lbl\">${data.acumulou ? 'ESTIMATIVA ACUMULADA' : 'PRÊMIO ESTIMADO'}</div>\n","");
  html=html.replace("      <div class=\"hh-premio-val\">${formatBRL(data.acumuladaProxConcurso)}</div>\n","");
  var CSS=String.raw`<style id="thor-cor-nativa-05">
#overlayListaResultados{padding-left:0!important;background:#07101f!important}
#homeSideNav{display:none!important}
#overlayListaResultados .home-topbar{position:relative!important}
#overlayListaResultados .home-topbar-left{width:100%!important;justify-content:center!important;position:relative!important}
#overlayListaResultados .home-icon-btn{display:none!important}
#overlayListaResultados #listaResultadosVoltar{display:flex!important;position:absolute!important;left:0!important;top:50%!important;transform:translateY(-50%)!important;width:42px!important;height:42px!important;align-items:center!important;justify-content:center!important;border-radius:12px!important;border:1px solid #346aa7!important;background:#111d33!important;color:#fff!important;z-index:20!important}
#overlayListaResultados .home-hero::before{content:none!important;display:none!important}
#overlayListaResultados .home-hero h2{display:block!important;margin:0 0 14px!important;font-size:clamp(28px,8vw,46px)!important;line-height:.95!important;color:#fff!important;text-transform:uppercase!important;font-style:italic!important;font-weight:1000!important;letter-spacing:-1.4px!important;text-shadow:0 3px 0 rgba(30,40,60,.9),0 0 18px var(--hero-accent)!important}
#overlayListaResultados .home-hero{border:2px solid color-mix(in srgb,var(--hero-accent) 72%,white)!important;background:radial-gradient(ellipse at 52% 28%,color-mix(in srgb,var(--hero-accent) 88%,transparent) 0%,color-mix(in srgb,var(--hero-accent) 42%,#07111d) 42%,#07111d 88%)!important;box-shadow:inset 0 0 58px color-mix(in srgb,var(--hero-accent) 55%,transparent),0 0 8px color-mix(in srgb,var(--hero-accent) 78%,white),0 0 30px color-mix(in srgb,var(--hero-accent) 58%,transparent)!important;transition:background .25s,border-color .25s,box-shadow .25s!important}
#overlayListaResultados .hh-ball{background:radial-gradient(circle at 30% 22%,#fff7c7 0%,#ffe27a 16%,#dca62d 43%,#8b5a08 76%,#3b2200 100%)!important;border:1px solid #ffd85a!important;color:#111!important;text-shadow:0 1px 0 rgba(255,255,255,.65)!important;box-shadow:inset 2px 2px 5px rgba(255,255,255,.72),inset -3px -4px 7px rgba(74,38,0,.55),0 2px 5px rgba(0,0,0,.48),0 0 8px rgba(255,190,35,.38)!important}
#overlayListaResultados .hh-stats-btn{background:linear-gradient(135deg,color-mix(in srgb,var(--hero-accent) 82%,#00140b),color-mix(in srgb,var(--hero-accent) 82%,white))!important;border:1px solid color-mix(in srgb,var(--hero-accent) 70%,white)!important;box-shadow:0 4px 0 color-mix(in srgb,var(--hero-accent) 55%,black),0 0 16px color-mix(in srgb,var(--hero-accent) 55%,transparent)!important}
#overlayListaResultados .home-tab.active{background:linear-gradient(135deg,color-mix(in srgb,var(--tab-accent) 78%,black),var(--tab-accent),color-mix(in srgb,var(--tab-accent) 72%,white))!important;border-color:color-mix(in srgb,var(--tab-accent) 65%,white)!important;box-shadow:0 0 8px var(--tab-accent),0 0 20px color-mix(in srgb,var(--tab-accent) 60%,transparent)!important;color:#fff!important}
#overlayListaResultados .home-free-banner{min-height:68px!important;padding:7px 14px!important;box-sizing:border-box!important}
@media(max-width:360px){#overlayListaResultados{padding-left:0!important}}
</style>`;
  html=html.replace('</head>',CSS+'\n</head>');
  document.open();document.write(html);document.close();
 }).catch(function(err){var b=document.getElementById('thorBoot');if(b)b.innerHTML='<div class="thorBootBox">Não foi possível carregar o app.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:9px;background:#7c21e8;color:#fff;font-weight:800">TENTAR NOVAMENTE</button></div>';console.error(err)});
})();
</script>
</body>
</html>
