const API='https://servicebus2.caixa.gov.br/portaldeloterias/api/';const LATEST_STORE='thor_falhas_latest_v131';function lerUltimos(){try{return JSON.parse(localStorage.getItem(LATEST_STORE)||'{}')||{}}catch(_){return {}}}function guardarUltimo(k,d){if(!d||!d.c)return;try{const m=lerUltimos(),a=m[k];if(!a||(+d.c)>=+(a.c||0)){m[k]=d;localStorage.setItem(LATEST_STORE,JSON.stringify(m))}}catch(_){}}function ultimoGuardado(k){try{return lerUltimos()[k]||null}catch(_){return null}}const CURRENT_STORE='thor_falhas_current_v1';function lerAtuais(){try{return JSON.parse(localStorage.getItem(CURRENT_STORE)||'{}')||{}}catch(_){return {}}}function guardarAtual(k,n){n=+n;if(!n)return;try{const m=lerAtuais();m[k]=n;localStorage.setItem(CURRENT_STORE,JSON.stringify(m))}catch(_){}}function atualGuardado(k){try{return +(lerAtuais()[k]||0)}catch(_){return 0}}const LOT={lotofacil:['Lotofácil','lotofacil',15,25],megasena:['Mega-Sena','megasena',6,60],quina:['Quina','quina',5,80],lotomania:['Lotomania','lotomania',20,100],timemania:['Timemania','timemania',7,80],duplasena:['Dupla Sena','duplasena',6,50],diadesorte:['Dia de Sorte','diadesorte',7,31],maismilionaria:['+Milionária','maismilionaria',6,50],supersete:['Super Sete','supersete',7,10]};let key='lotofacil',pending=key,mode='fail',latest=0,draw=null,cache={};let palpites={};let selecaoAtiva=null;try{palpites=JSON.parse(localStorage.getItem('thor_falhas_palpites_v1')||'{}')||{}}catch(_){palpites={}}function salvarPalpites(){try{localStorage.setItem('thor_falhas_palpites_v1',JSON.stringify(palpites))}catch(_){}};const segundoSorteio=j=>{const a=j?.listaDezenasSegundoSorteio??j?.dezenasSegundoSorteio??j?.segundoSorteio??j?.listaDezenas2??[];return Array.isArray(a)&&a.length===6&&new Set(a.map(Number)).size===6&&a.every(v=>Number.isInteger(+v)&&+v>=1&&+v<=50)?a.map(Number):[]};const $=x=>document.getElementById(x),two=n=>String(n).padStart(2,'0');function wilson(s,n){if(!n)return 0;let z=1.959963984540054,p=s/n,z2=z*z,d=1+z2/n,c=(p+z2/(2*n))/d,h=z*Math.sqrt((p*(1-p)+z2/(4*n))/n)/d;return Math.max(0,c-h)}async function fetchC(n=null){

        const dezenas=j.listaDezenas||j.dezenas||j.numeros||[];

        return {c:numero,date:j.dataApuracao||j.data||'',nums:dezenas.map(Number),nums2:key==='duplasena'?segundoSorteio(j):[]};

    })();
    const app=(async()=>{
      if(!window.parent||window.parent===window||typeof window.parent.fetchConcursoLoteria!=='function'||!Array.isArray(window.parent.GAMES))throw new Error('Sem fonte do app');
      const game=window.parent.GAMES.find(g=>g.slug===slug||g.altSlug===slug);
      if(!game)throw new Error('Loteria indisponível');
      const x=await window.parent.fetchConcursoLoteria(game,n);
      if(+x?.concurso!==+n||!Array.isArray(x.dezenas)||!x.dezenas.length)throw new Error('Concurso diferente');
      return {c:+x.concurso,date:x.data||'',nums:x.dezenas.map(Number),nums2:key==='duplasena'?(x.dezenasSegundoSorteio||x.segundoSorteio||[]):[]};
    })();
    try{const d=await Promise.any([direto,app]);cache[key+n]=d;return d}catch(_){}
  }
  // Para o ÚLTIMO concurso, usa primeiro a fonte única central do THOR.
  // Isso mantém esta aba sincronizada com a tela principal e as demais abas.

      if(!Number.isInteger(c)||!Array.isArray(nums)||nums.length!==LOT[key][2]||new Set(nums.map(Number)).size!==nums.length||nums.some(v=>!Number.isInteger(Number(v))||Number(v)<(key==='lotomania'?0:1)||Number(v)>LOT[key][3]))throw Error('Resultado inválido');

  try{

      if(game){

        if(x&&x.concurso&&Array.isArray(x.dezenas)&&x.dezenas.length){
          const d={c:+x.concurso,date:x.data||'',nums:x.dezenas.map(Number),nums2:key==='duplasena'?(x.dezenasSegundoSorteio||x.segundoSorteio||[]):[]};
          if(n){cache[key+n]=d;return d}

  const urls=[
    'https://servicebus2.caixa.gov.br/portaldeloterias/api/'+slug+(n?'/'+n:'')+'?timestamp='+Date.now(),
    'https://servicebus2.caixa.gov.br/portaldeloterias/api/'+slug+(n?'/'+n:'')+'?v='+Date.now(),
    'https://loteriascaixa-api.herokuapp.com/api/'+slug+(n?'/'+n:'/latest'),
    'https://loterias-gutotech.herokuapp.com/api/'+slug+(n?'/'+n:'/latest'),
    'https://loterias-caixa-gov.herokuapp.com/api/'+slug+(n?'/'+n:'/latest')
  ];

  const tentativas=await Promise.allSettled(urls.map(async base=>{
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),4500);
    try{
      const sep=base.includes('?')?'&':'?';
      const r=await fetch(base+sep+'_thor='+Date.now(),{
        cache:'no-store',
        signal:ctl.signal,
        headers:{Accept:'application/json','Cache-Control':'no-cache'}
      });
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      const numero=+(j.numero||j.concurso||j.numeroConcurso||0);
      const dezenas=j.listaDezenas||j.dezenas||j.numeros||[];
      if(!numero||!Array.isArray(dezenas)||!dezenas.length)throw new Error('Resposta inválida');
      if(n && numero!==+n)throw new Error('Concurso diferente do solicitado');
      return {c:numero,date:j.dataApuracao||j.data||'',nums:dezenas.map(Number),nums2:key==='duplasena'?segundoSorteio(j):[]};
    }finally{clearTimeout(timer)}
  }));

  for(const t of tentativas){
    if(t.status==='fulfilled'){
      const d=t.value;
      if(n){cache[key+n]=d;return d}
      candidatos.push(d);
    }else{
      ultimoErro=t.reason||ultimoErro;
    }
  }

  if(candidatos.length){
    candidatos.sort((a,b)=>b.c-a.c);
    return candidatos[0];
  }
  throw ultimoErro||new Error('Nenhuma fonte disponível');
}function render(){if(!draw)return;guardarAtual(key,draw.c);$('contest').value=draw.c;$('target').textContent=draw.c+1;$('date').textContent=draw.date;$('balls').innerHTML=draw.nums.slice().sort((a,b)=>a-b).map(n=>'<span class="ball">'+two(n)+'</span>').join('');const segunda=key==='duplasena'&&Array.isArray(draw.nums2)&&draw.nums2.length===6; $('firstDrawLabel').style.display=key==='duplasena'?'block':'none'; $('secondDraw').style.display=segunda?'block':'none'; $('balls2').innerHTML=segunda?draw.nums2.slice().sort((a,b)=>a-b).map(n=>'<span class="ball">'+two(n)+'</span>').join(''):'';$('qty').max=draw.nums.length;if(selecaoAtiva&&selecaoAtiva.key===key&&selecaoAtiva.mode===mode)$('qty').value=selecaoAtiva.q;$('next').disabled=draw.c>=latest;
  // As dezenas ficam travadas no último CALCULAR. Navegar só troca o concurso e confere.
  const pal=(selecaoAtiva&&selecaoAtiva.key===key&&selecaoAtiva.mode===mode)?selecaoAtiva:null;
  if(pal){
    const qExibir=Math.max(1,Math.min(pal.q||pal.ranking.length,pal.ranking.length));
    const conferindo=+draw.c>+pal.base;
    const conf=pal.ranking.slice(0,qExibir).map(r=>({...r,sorteada:conferindo&&draw.nums.includes(r.v)}));
    $('resultTitle').textContent=conferindo?qExibir+' dezenas escolhidas • concurso '+draw.c:qExibir+' dezenas para '+(mode==='repeat'?'REPETIR':'FALHAR')+' • concurso '+(+pal.base+1);
    $('rank').innerHTML=conf.map((r,i)=>'<div class="rankItem'+(r.sorteada?' acerto-confirmado':'')+'"><div class="rankHead"><span class="rankBall">'+two(r.v)+'</span><small>'+(i+1)+'º</small></div><div class="pct">'+(r.score*100).toFixed(2).replace('.',',')+'%</div>'+(r.sorteada?'<div class="acertou-label">SORTEADA</div>':'')+'</div>').join('');
    $('result').classList.add('show');
  }else{
    $('result').classList.remove('show');
  }
}async function load(n=null){$('status').textContent='Carregando resultado oficial...';if(!n&&!draw){const salvo=ultimoGuardado(key);if(salvo&&salvo.c){draw=salvo;latest=Math.max(latest,+salvo.c);render();$('status').textContent='Conferindo concursos mais recentes...'}}try{if(n){const recebido=await fetchC(n);draw=recebido;latest=Math.max(latest||0,+recebido.c)}else{const recebido=await fetchC();const salvo=ultimoGuardado(key);const melhor=(salvo&&+salvo.c>+recebido.c)?salvo:recebido;latest=Math.max(latest||0,+melhor.c,+recebido.c);guardarUltimo(key,melhor);draw=melhor;guardarAtual(key,melhor.c)}render();$('status').textContent=draw&&+draw.c<latest?LOT[key][0]+' • último disponível: '+latest+' • analisando concurso '+draw.c:LOT[key][0]+' • concurso carregado pela CAIXA'}catch(e){$('status').textContent='Não foi possível carregar. Toque em ATUALIZAR CONCURSOS.'}}async function calculate(){if(!draw)return;const concursoCalculado=+draw.c;const calcBtn=$('calc');if(calcBtn.dataset.busy==='1')return;calcBtn.dataset.busy='1';calcBtn.classList.add('calculando');calcBtn.innerHTML='<span class="calcSpinner"></span>CALCULANDO...';$('result').classList.remove('show');const inicioCalc=Date.now();let q=Math.max(1,Math.min(+$('qty').value||6,draw.nums.length));$('status').textContent='Carregando os últimos 10 concursos...';try{let ns=[];for(let n=Math.max(1,draw.c-10);n<=draw.c;n++)ns.push(n);let ds=await Promise.all(ns.map(fetchC));let ranking=draw.nums.map(v=>{let a=0,s=0;for(let i=0;i<ds.length-1;i++){if(ds[i].nums.includes(v)){a++;let rep=ds[i+1].nums.includes(v);if(mode==='repeat'?rep:!rep)s++}}return{v,score:wilson(s,a)}}).sort((a,b)=>b.score-a.score).slice(0,q);if(mode==='fail'){palpites[key+'|'+draw.c]={base:draw.c,q,mode:'fail',ranking:ranking.map(r=>({v:r.v,score:r.score}))};salvarPalpites()}else{palpites[key+'|repeat|'+draw.c]={base:draw.c,q,mode:'repeat',ranking:ranking.map(r=>({v:r.v,score:r.score}))};salvarPalpites()}selecaoAtiva={key:key,mode:mode,base:draw.c,q:q,ranking:ranking.map(r=>({v:r.v,score:r.score}))};$('resultTitle').textContent=q+' dezenas para '+(mode==='repeat'?'REPETIR':'FALHAR')+' • concurso '+(draw.c+1);$('rank').innerHTML=ranking.map((r,i)=>'<div class="rankItem"><div class="rankHead"><span class="rankBall">'+two(r.v)+'</span><small>'+(i+1)+'º</small></div><div class="pct">'+(r.score*100).toFixed(2).replace('.',',')+'%</div></div>').join('');const esperaResultado=Math.max(0,3000-(Date.now()-inicioCalc));if(esperaResultado)await new Promise(resolve=>setTimeout(resolve,esperaResultado));$('result').classList.add('show');$('status').textContent=mode==='repeat'?'Repetições calculadas':'Falhas calculadas — avance para o próximo concurso para conferir'}catch(e){$('status').textContent='Não foi possível calcular'}finally{const espera=Math.max(0,3000-(Date.now()-inicioCalc));await new Promise(resolve=>setTimeout(resolve,espera));/* CALCULAR nunca navega: mantém exatamente o concurso escolhido pelo usuário. */if(draw&&+draw.c===concursoCalculado){$('contest').value=concursoCalculado;guardarAtual(key,concursoCalculado)}calcBtn.classList.remove('calculando');calcBtn.dataset.busy='0';calcBtn.textContent='CALCULAR'}}function modal(){let o=$('opts');o.innerHTML='';Object.entries(LOT).forEach(([k,v])=>{let b=document.createElement('button');b.className='opt'+(pending===k?' sel':'');b.textContent=v[0];b.onclick=()=>{pending=k;modal()};o.appendChild(b)});$('modal').classList.add('show')}$('trigger').onclick=()=>{pending=key;modal()};$('confirm').onclick=()=>{key=pending;$('trigger').textContent=LOT[key][0]+'⌄';$('modal').classList.remove('show');cache={};draw=null;latest=0;load()};function restaurarSelecaoModo(novoModo){mode=novoModo;$('fail').classList.toggle('active',mode==='fail');$('repeat').classList.toggle('active',mode==='repeat');const k=mode==='fail'?(key+'|'+(draw?draw.c:'')):(key+'|repeat|'+(draw?draw.c:''));const p=palpites[k];if(p&&draw){selecaoAtiva={key:key,mode:mode,base:+p.base,q:+p.q,ranking:(p.ranking||[]).map(r=>({v:+r.v,score:+r.score}))};}else{selecaoAtiva=null;}render()}$('fail').onclick=()=>restaurarSelecaoModo('fail');$('repeat').onclick=()=>restaurarSelecaoModo('repeat');$('prev').onclick=()=>draw&&draw.c>1&&load(draw.c-1);$('next').onclick=()=>draw&&draw.c<latest&&load(draw.c+1);$('contest').addEventListener('change',()=>{let n=parseInt($('contest').value,10);if(!Number.isFinite(n)||n<1){$('contest').value=draw?draw.c:'';return}if(latest&&n>latest)n=latest;load(n)});$('contest').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('contest').blur()}});$('calc').onclick=calculate;$('qty').addEventListener('input',()=>{$('status').textContent='Quantidade alterada. As dezenas atuais continuam até apertar CALCULAR.'});
let atualizacaoAutomaticaEmCurso=false;
async function atualizarConcursosCaixa(){
  if(atualizacaoAutomaticaEmCurso) return;
  // Não interfere na navegação nem durante um cálculo em andamento.
  if($('calc')&&$('calc').dataset.busy==='1') return;
  if(navigator.onLine===false) return;
  atualizacaoAutomaticaEmCurso=true;
  cache={};
  // Atualiza somente o limite do concurso mais recente.
  // Se o usuário estiver analisando um concurso antigo, NÃO pula a tela para o último:
  // ele continua avançando concurso por concurso pelos botões ANTERIOR/PRÓXIMO.
  const salvo=ultimoGuardado(key);
  const concursoVisualAtual=(draw&&draw.c)?+draw.c:0;
  const concursoAntes=Math.max(latest||0,concursoVisualAtual,+(salvo&&salvo.c||0));
  const ultimoAnterior=Math.max(latest||0,+(salvo&&salvo.c||0));
  const estavaNoUltimo=!draw||concursoVisualAtual>=ultimoAnterior;
  try{
    const novo=await fetchC();
    if(!novo||!novo.c) return;
    if(concursoAntes&&novo.c<concursoAntes){
      return;
    }
    const melhor=(salvo&&+salvo.c>+novo.c)?salvo:novo;
    latest=Math.max(latest||0,+novo.c,+(melhor&&melhor.c||0));
    guardarUltimo(key,melhor);

    // Atualiza apenas qual é o concurso mais recente disponível.
    // Nunca troca o concurso que a pessoa está analisando. Assim CALCULAR,
    // foco/retorno ao app e atualização automática não avançam sozinhos.
    // A mudança de concurso fica exclusivamente nos botões ANTERIOR/PRÓXIMO
    // ou no campo de concurso.
    if(!draw){
      draw=melhor;
      guardarAtual(key,draw.c);
    }else if(estavaNoUltimo && +melhor.c>+draw.c){
      // Se estava no último concurso conhecido, acompanha automaticamente o novo resultado.
      draw=melhor;
      guardarAtual(key,draw.c);
    }
    render();

    if(draw&&+draw.c<latest){
      $('status').textContent=LOT[key][0]+' • último disponível: '+latest+' • analisando concurso '+draw.c;
    }else{
      $('status').textContent=LOT[key][0]+' • concurso '+latest+' atualizado pela CAIXA';
    }
  }catch(e){
    if(!draw) await load();
  }finally{
    atualizacaoAutomaticaEmCurso=false;
  }
}
$('refresh').onclick=atualizarConcursosCaixa;

// Atualiza o limite do concurso mais recente sem trocar o concurso que está sendo analisado.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') atualizarConcursosCaixa();
});
window.addEventListener('focus',atualizarConcursosCaixa);
window.addEventListener('online',atualizarConcursosCaixa);

// Enquanto a tela estiver aberta, confere periodicamente se a CAIXA publicou concurso novo.
setInterval(()=>{
  if(document.visibilityState==='visible' && navigator.onLine!==false) atualizarConcursosCaixa();
},10*1000);

// Força nova consulta também quando o iframe é restaurado do cache do Android/WebView.
window.addEventListener('pageshow',()=>atualizarConcursosCaixa());
// Na abertura, ignora o concurso visual antigo salvo e sincroniza imediatamente com a fonte única.
(async()=>{
  // Exibe o último resultado salvo imediatamente, sem depender da rede.
  const salvo=ultimoGuardado(key);
  if(salvo&&salvo.c&&Array.isArray(salvo.nums)&&salvo.nums.length){
    draw=salvo;latest=+salvo.c;render();
    $('status').textContent='Conferindo resultados mais recentes...';
  }
  // Consulta a fonte compartilhada do aplicativo antes das APIs externas.
  try{
    const resp=await fetch('resultados-atualizados.json?v='+Date.now(),{cache:'no-store'});
    if(resp.ok){
      const json=await resp.json();
      const x=json?.resultados?.[LOT[key][1]];
      if(x&&+x.concurso>0&&Array.isArray(x.dezenas)&&x.dezenas.length===LOT[key][2]){
        const d={c:+x.concurso,date:x.data||'',nums:x.dezenas.map(Number),nums2:key==='duplasena'?(x.dezenasSegundoSorteio||x.segundoSorteio||[]):[]};
        if(!draw||d.c>=draw.c){draw=d;latest=Math.max(latest,d.c);guardarUltimo(key,d);render();}
      }
    }
  }catch(_){}
  // Se não há cache, carrega diretamente; atualizações posteriores são em segundo plano.
  if(!draw) await load();
  atualizarConcursosCaixa();
})();
