<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4d94"><title>Probabilidade de Falha — Loterias CAIXA</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font-family:Arial,Helvetica,sans-serif;padding:10px}.app{width:min(100%,430px);margin:0 auto}.title{background:linear-gradient(#1768bb,#0e4c90);color:#fff;text-align:center;font-weight:800;padding:10px;border-radius:8px 8px 0 0}.box,.calcBox,.result{background:#fff;border:1px solid #ccd5df;padding:10px;box-shadow:0 2px 7px #0001}.box{margin-bottom:8px}label,.modeLabel{display:block;font-size:10px;color:#657382;font-weight:800;margin-bottom:5px}.trigger{width:100%;height:34px;border:1px solid #b7c7d6;border-radius:8px;background:linear-gradient(#fff,#edf3f8);color:#174d7f;font-weight:900}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.mode button{height:28px;border:1px solid #c3d0dc;border-radius:7px;font-size:10px;font-weight:900}.fail.active{color:#fff;background:linear-gradient(#ff6670,#cf2937)}.repeat.active{color:#fff;background:linear-gradient(#42cf83,#159653)}.navigator{display:grid;grid-template-columns:78px 1fr 78px;gap:6px}.navBtn{height:34px;border:1px solid #b9c9d9;border-radius:6px;background:#edf3f8;color:#24537e;font-size:9px;font-weight:900}.current{height:34px;border:1px solid #9eb6cd;border-radius:6px;text-align:center;background:#f8fafc}.current small{display:block;font-size:7px;color:#7d8794}.current b{font-size:18px;color:#0d4d94}.target{text-align:center;font-size:9px;color:#788593;margin:7px}.previousTitle{display:flex;justify-content:space-between;font-size:11px;font-weight:800}.balls{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:7px}.ball,.rankBall{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#3a93eb,#0b58a4);color:#fff;font-size:9px;font-weight:900}.calcBox{text-align:center}.qty{width:82px;height:30px;text-align:center;font-size:15px;font-weight:900}.action{width:100%;height:33px;margin-top:7px;border-radius:6px;color:#fff;font-weight:900;border:1px solid #0d7c3e;background:linear-gradient(#38c774,#15964e)}.refresh{height:28px;background:#eaf1f8;color:#28527c;border-color:#c5d2df;font-size:10px}.status{font-size:9.5px;color:#738092;margin-top:6px}.result{display:none;margin-top:8px}.result.show{display:block}.result h2{font-size:12px;text-align:center}.rankGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.rankItem{border:1px solid #d6dee7;border-radius:7px;padding:6px;text-align:center}.rankHead{display:flex;align-items:center;justify-content:center;gap:6px}.rankBall{background:linear-gradient(145deg,#ff6969,#c92432)}.pct{font-size:13px;font-weight:900;color:#c42130}.modal{position:fixed;inset:0;background:#111d2c99;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}.modal.show{display:flex}.modalBox{width:min(100%,400px);max-height:90vh;overflow:auto;background:#eef7ff;border-radius:18px;padding:8px}.opt{width:100%;height:48px;margin:3px 0;border:1px solid #c8d8e8;border-radius:12px;background:#fff;text-align:left;padding:0 12px;font-weight:900;color:#164a78}.opt.sel{border-color:#d72aa6;background:#fff0fb}.confirm{width:100%;height:38px;margin-top:6px;border:0;border-radius:10px;background:#0757b5;color:#fff;font-weight:900}
</style></head><body><div class="app"><div class="title">Probabilidade de Falha</div><section class="box"><label>Escolha a loteria</label><button class="trigger" id="trigger">Lotofácil⌄</button><div class="modeLabel" style="margin-top:8px">Tipo de análise</div><div class="mode"><button id="fail" class="fail active">FALHAR</button><button id="repeat" class="repeat">REPETIR</button></div><div class="navigator"><button class="navBtn" id="prev">‹<br>ANTERIOR</button><div class="current"><small>CONCURSO</small><b id="contest">—</b></div><button class="navBtn" id="next">›<br>PRÓXIMO</button></div><div class="target">Análise para o concurso seguinte: <b id="target">—</b></div><div class="previousTitle"><span>Dezenas do concurso</span><span id="date">—</span></div><div class="balls" id="balls"></div></section><section class="calcBox"><label>Quantas dezenas deseja analisar?</label><input class="qty" id="qty" type="number" min="1" value="6"><button class="action" id="calc">CALCULAR</button><button class="action refresh" id="refresh">ATUALIZAR CONCURSOS</button><div class="status" id="status">Carregando resultado oficial...</div></section><section class="result" id="result"><h2 id="resultTitle"></h2><div class="rankGrid" id="rank"></div></section></div><div class="modal" id="modal"><div class="modalBox"><div id="opts"></div><button class="confirm" id="confirm">CONFIRMAR</button></div></div><script>
const API='https://servicebus2.caixa.gov.br/portaldeloterias/api/';const LOT={lotofacil:['Lotofácil','lotofacil',15,25],megasena:['Mega-Sena','megasena',6,60],quina:['Quina','quina',5,80],lotomania:['Lotomania','lotomania',20,100],timemania:['Timemania','timemania',7,80],duplasena:['Dupla Sena','duplasena',6,50],diadesorte:['Dia de Sorte','diadesorte',7,31],maismilionaria:['+Milionária','maismilionaria',6,50],supersete:['Super Sete','supersete',7,10]};let key='lotofacil',pending=key,mode='fail',latest=0,draw=null,cache={};const $=x=>document.getElementById(x),two=n=>String(n).padStart(2,'0');function wilson(s,n){if(!n)return 0;let z=1.959963984540054,p=s/n,z2=z*z,d=1+z2/n,c=(p+z2/(2*n))/d,h=z*Math.sqrt((p*(1-p)+z2/(4*n))/n)/d;return Math.max(0,c-h)}async function fetchC(n=null){let ep=LOT[key][1],u=API+ep+(n?'/'+n:'');if(n&&cache[key+n])return cache[key+n];let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error();let j=await r.json(),d={c:+j.numero,date:j.dataApuracao||'',nums:(j.listaDezenas||[]).map(Number)};if(n)cache[key+n]=d;return d}function render(){if(!draw)return;$('contest').textContent=draw.c;$('target').textContent=draw.c+1;$('date').textContent=draw.date;$('balls').innerHTML=draw.nums.slice().sort((a,b)=>a-b).map(n=>'<span class="ball">'+two(n)+'</span>').join('');$('qty').max=draw.nums.length;$('next').disabled=draw.c>=latest}async function load(n=null){$('status').textContent='Carregando resultado oficial...';try{draw=await fetchC(n);if(!n)latest=draw.c;render();$('status').textContent=LOT[key][0]+' • concurso carregado pela CAIXA'}catch(e){$('status').textContent='Não foi possível carregar. Toque em ATUALIZAR CONCURSOS.'}}async function calculate(){if(!draw)return;let q=Math.max(1,Math.min(+$('qty').value||6,draw.nums.length));$('status').textContent='Carregando os últimos 10 concursos...';try{let ns=[];for(let n=Math.max(1,draw.c-10);n<=draw.c;n++)ns.push(n);let ds=await Promise.all(ns.map(fetchC));let ranking=draw.nums.map(v=>{let a=0,s=0;for(let i=0;i<ds.length-1;i++){if(ds[i].nums.includes(v)){a++;let rep=ds[i+1].nums.includes(v);if(mode==='repeat'?rep:!rep)s++}}return{v,score:wilson(s,a)}}).sort((a,b)=>b.score-a.score).slice(0,q);$('resultTitle').textContent=q+' dezenas para '+(mode==='repeat'?'REPETIR':'FALHAR')+' • concurso '+draw.c;$('rank').innerHTML=ranking.map((r,i)=>'<div class="rankItem"><div class="rankHead"><span class="rankBall">'+two(r.v)+'</span><small>'+(i+1)+'º</small></div><div class="pct">'+(r.score*100).toFixed(2).replace('.',',')+'%</div></div>').join('');$('result').classList.add('show');$('status').textContent=mode==='repeat'?'Repetições calculadas':'Falhas calculadas'}catch(e){$('status').textContent='Não foi possível calcular'}}function modal(){let o=$('opts');o.innerHTML='';Object.entries(LOT).forEach(([k,v])=>{let b=document.createElement('button');b.className='opt'+(pending===k?' sel':'');b.textContent=v[0];b.onclick=()=>{pending=k;modal()};o.appendChild(b)});$('modal').classList.add('show')}$('trigger').onclick=()=>{pending=key;modal()};$('confirm').onclick=()=>{key=pending;$('trigger').textContent=LOT[key][0]+'⌄';$('modal').classList.remove('show');cache={};load()};$('fail').onclick=()=>{mode='fail';$('fail').classList.add('active');$('repeat').classList.remove('active');$('result').classList.remove('show')};$('repeat').onclick=()=>{mode='repeat';$('repeat').classList.add('active');$('fail').classList.remove('active');$('result').classList.remove('show')};$('prev').onclick=()=>draw&&draw.c>1&&load(draw.c-1);$('next').onclick=()=>draw&&draw.c<latest&&load(draw.c+1);$('calc').onclick=calculate;$('refresh').onclick=()=>{cache={};load()};load();
</script></body></html>
