.pattern-check-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.pattern-key{display:inline-flex;align-items:center;gap:5px;font-size:11px}.pattern-key i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 2px 3px #ffffff88}.key-fail{background:#d82e42}.key-coming{background:#159453}.pattern-check-legend small{flex-basis:100%;font-size:9px;font-weight:400}.pattern-rates span+span{background:#f9e2e5;color:#922637;border-color:#d9a0a8}.pattern-check{color:#263545}

/* V113: destaque do melhor padrão calculado */
.best-pattern-panel{margin:8px 0;padding:7px;border:2px solid #c39830;border-radius:8px;background:linear-gradient(135deg,#fff8da,#ede3bb);box-shadow:0 0 8px #d5ae4d55}.best-pattern-heading{font-size:12px;font-weight:900;color:#50351a;text-align:center;padding:4px}.best-pattern-panel>.pattern-item{border-color:#b58b2d;background:linear-gradient(135deg,#fffef6,#e9edf0)}.best-pattern-panel>.pattern-item>strong{font-size:13px;color:#3d215e}.best-pattern-panel .pattern-rates{font-size:12px;font-weight:900}.best-pattern-panel>p{font-size:9px!important}

/* V115: bolas brancas até conferir o resultado */
.pattern-balls b[data-pattern-number][data-intent]{background:radial-gradient(circle at 30% 20%,#fff 15%,#f6f7f8 45%,#cbd0d5 100%);color:#27313c;border-color:#adb4bd;opacity:1}
.pattern-balls b[data-pattern-number].pattern-hit{background:linear-gradient(#65dca0,#15814d);color:#fff;border-color:#207b4b;opacity:1}
.pattern-balls b[data-pattern-number].pattern-miss{background:linear-gradient(#f67e87,#b72235);color:#fff;border-color:#aa2939;opacity:1}
.pattern-balls b[data-pattern-number].pattern-muted{background:#e7e9ec;color:#8c9299;border-color:#c8cdd2;opacity:.42;box-shadow:none}

/* V117: marcas pequenas apenas nas indicações acertadas */
.pattern-check{width:10px;height:10px;line-height:10px;font-size:8px;right:-2px;top:-3px}.pattern-hit .pattern-check{color:#137448}.pattern-miss .pattern-check{color:#b32338}

.pattern-count-controls{display:flex;align-items:end;gap:7px;margin:6px 0}.pattern-count-controls label{flex:1;font-size:10px;font-weight:800;color:#423252}.pattern-count-controls input{display:block;width:100%;box-sizing:border-box;font-size:13px;height:30px;padding:3px 7px;margin-top:3px}.pattern-count-controls button{font-size:11px;height:30px;padding:3px 10px}

#calc.calculation-spinning{display:flex;align-items:center;justify-content:center;gap:8px;opacity:1!important}#calc.calculation-spinning::before{content:"";display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:calculation-spin .65s linear infinite;flex:0 0 auto}@keyframes calculation-spin{to{transform:rotate(360deg)}}

/* V131: largura completa somente da tela Linhas e Colunas Pro. */
html,body{width:100%;max-width:none;margin:0;padding:0}
body>main{width:100%;max-width:none;margin:0;padding:6px 2px}
body>main>.card{width:100%;max-width:none;margin-left:0;margin-right:0}
#grid[data-lottery="lotofacil"]{width:90%;max-width:none;margin:0 auto;justify-self:center}

/* V133: quadrados compactos somente na grade da Lotofácil. */
#grid[data-lottery="lotofacil"]{width:100%!important;max-width:236px!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important;padding:4px!important;margin:0 auto!important;justify-self:center!important}
#grid[data-lottery="lotofacil"] .ball{aspect-ratio:1!important;height:auto!important;min-height:0!important;font-size:13px!important;border-radius:6px!important}
#grid[data-lottery="lotofacil"] .ball span{font-size:8px!important}

.fold-range-banner{margin:9px 0 7px;padding:9px 11px;border:1px solid #b99748;border-radius:11px;background:linear-gradient(115deg,#fff8dc,#f3e6bd 55%,#fffaf0);color:#42300f;font-size:12px;line-height:1.4;text-align:center}.fold-range-banner strong{display:block;font-size:13px;margin-bottom:3px}.fold-range-banner .range-highlight{font-weight:850;color:#125b37}.fold-range-banner.invalid{background:#fff0e9;color:#8a3025}

#foldView #clearFoldGames{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:3px 7px;min-height:26px;border:1px solid #a51d2b;border-radius:7px;background:linear-gradient(#f86770,#cf2436 55%,#8f1020);color:#fff;font-size:10px;line-height:11px;font-weight:700;white-space:nowrap;box-shadow:inset 0 1px 2px #ffffff80,0 2px 3px #0003} #clearFoldGames svg{width:12px;height:12px;flex:none}

function groupFailureLabel(group,draws,base,windowSize,metrics){
 if(!group?.length)return '';
 const sample=draws.filter(d=>d.id<=base).slice(-Math.max(1,Number(windowSize)||10));
 const values=group.map(n=>{
  if(Number.isFinite(metrics?.[n]?.bayes))return Math.min(98,Math.max(0,metrics[n].bayes));
  if(!sample.length)return null;
  const universe=draws===foldSnapshot?.history?foldSnapshot.numbers.length:cfg()[2];
  const prior=(universe-sample.at(-1).n.length)/universe;
  const misses=sample.filter(d=>!d.n.includes(n)).length;
  return Math.min(98,Math.max(0,100*(misses+2*prior)/(sample.length+2)));
 }).filter(v=>v!==null);
 return values.length?'Falha média: '+(values.reduce((a,b)=>a+b,0)/values.length).toFixed(1).replace('.',',')+'%':'Sem histórico';
}

function foldChoose(n,k){

function foldUniquePossibilities(pools,size){

  for(let mask=1;mask<(1<<unique.length);mask++){

    for(let i=0;i<unique.length;i++)if(mask&(1<<i)){
      bits++;

      if(intersection.size<size)break;
    }
    if(intersection.size>=size)result+=(bits%2?1n:-1n)*foldChoose(intersection.size,size);

function buildLotteryPatterns(numbers,width){

  const bestComing=[...dominant].sort((a,b)=>b.p-a.p||b.delay-a.delay).slice(0,3);
  const bestFailing=[...dominant].sort((a,b)=>a.p-b.p||b.delay-a.delay).slice(0,3);
  const pct=v=>(100*v).toFixed(1).replace('.',',')+'%',balls=(ns,intent)=>ns.length?ns.map(n=>'<b data-pattern-number="'+n+'" data-intent="'+intent+'">'+pad(n)+'</b>').join(''):'Nenhuma indicação forte';
  const card=x=>'<article class="pattern-item"><strong>'+x.name+' · '+x.count+' dezena'+(x.count===1?'':'s')+' para sair</strong><p>Atraso: '+(x.unseen?'pelo menos ':'')+x.delay+' concursos · ocorreu '+x.occurrences+'/'+w+' vezes</p><div class="pattern-rates"><span>Ocorrer: '+pct(x.p)+'</span><span>Não ocorrer: '+pct(1-x.p)+'</span></div><p>'+(x.count===0?'Para fixar: nenhuma (padrão de falha)':'Para sair ('+x.coming.length+'):')+'</p><div class="pattern-balls">'+balls(x.coming,'coming')+'</div><p>Para falhar ('+x.failing.length+'):</p><div class="pattern-balls">'+balls(x.failing,'failing')+'</div></article>';
  const patternFamilies=new Map();
  items.forEach(item=>{if(!patternFamilies.has(item.name))patternFamilies.set(item.name,[]);patternFamilies.get(item.name).push(item)});
  // Regra de exclusividade: se o padrão dominante de uma família prevê zero
  // dezenas para sair, suas dezenas ficam vetadas para FIXAR nesta análise.
  // Uma indicação de falha nunca é invertida em indicação de fixação.
  const vetoFixar=new Set();
  patternFamilies.forEach(family=>{
   const dominante=[...family].sort((a,b)=>b.p-a.p||b.occurrences-a.occurrences)[0];
   if(dominante && dominante.count===0)dominante.numbers.forEach(n=>vetoFixar.add(n));
  });
  const crossScores=new Map(nums().map(n=>[n,{sum:0,weight:0,agreements:0,families:0}]));
  patternFamilies.forEach(family=>{
   const total=family.reduce((v,item)=>v+item.p,0);
   family[0].numbers.forEach(n=>{
    const vote=family.reduce((v,item)=>v+(item.coming.includes(n)?item.p:0),0)/total;
    const score=crossScores.get(n);score.sum+=vote;score.weight++;score.families++;
   });
  });
  // Cruzamentos par a par entre famílias: consenso para sair ou falhar.
  const families=[...patternFamilies.values()];
  for(let i=0;i<families.length;i++)for(let j=i+1;j<families.length;j++){
   const a=families[i],b=families[j],ta=a.reduce((v,x)=>v+x.p,0),tb=b.reduce((v,x)=>v+x.p,0);
   a[0].numbers.filter(n=>b[0].numbers.includes(n)).forEach(n=>{
    const va=a.reduce((v,x)=>v+(x.coming.includes(n)?x.p:0),0)/ta,vb=b.reduce((v,x)=>v+(x.coming.includes(n)?x.p:0),0)/tb;
    const yes=va*vb,no=(1-va)*(1-vb),score=crossScores.get(n);
    score.sum+=yes;score.weight+=yes+no;score.agreements++;
   });
  }
  const crossValue=n=>{const score=crossScores.get(n);return score.weight?score.sum/score.weight:0.5};
  const signatures=new Map(),numberFrequency=new Map(nums().map(n=>[n,0])),offset=cfg()[5],width=cfg()[4];
  sample.forEach((d,index)=>{
   const rowIds=[...new Set(d.n.map(n=>Math.floor((n-offset)/width)+1))].sort((a,b)=>a-b);
   const colIds=[...new Set(d.n.map(n=>(n-offset)%width+1))].sort((a,b)=>a-b);
   const odds=d.n.filter(n=>n%2!==0).length,signature=rowIds.length+'|'+colIds.length+'|'+odds;
   d.n.forEach(n=>numberFrequency.set(n,(numberFrequency.get(n)||0)+1));
   if(!signatures.has(signature))signatures.set(signature,{rows:rowIds.length,cols:colIds.length,odds,occurrences:0,last:0,examples:[]});
   const item=signatures.get(signature);item.occurrences++;item.last=index;item.examples.push({numbers:d.n,rowIds,colIds});
  });
  const combinationScore=x=>0.5*(x.occurrences+1)/(w+2)+0.5*Math.max(...x.examples.map(e=>e.numbers.reduce((v,n)=>v+crossValue(n),0)/e.numbers.length));
  const bestCombination=[...signatures.values()].sort((a,b)=>combinationScore(b)-combinationScore(a)||b.occurrences-a.occurrences||b.last-a.last)[0];
  let bestPattern=null;
  if(bestCombination){
   const chosen=[...bestCombination.examples].sort((a,b)=>b.numbers.reduce((v,n)=>v+crossValue(n),0)-a.numbers.reduce((v,n)=>v+crossValue(n),0))[0];
   const coming=[...chosen.numbers].sort((a,b)=>a-b);
   const rankedNumbers=nums().map(n=>({n,value:crossValue(n)})).sort((a,b)=>b.value-a.value||a.n-b.n);
   const scoreMean=rankedNumbers.reduce((v,x)=>v+x.value,0)/rankedNumbers.length;
   const scoreSpread=Math.sqrt(rankedNumbers.reduce((v,x)=>v+(x.value-scoreMean)**2,0)/rankedNumbers.length);
   const comingPool=new Set(coming);
   const selectedComing=rankedNumbers.filter(x=>comingPool.has(x.n)&&!vetoFixar.has(x.n)&&x.value>Math.max(0.75,scoreMean+scoreSpread)+1e-9).map(x=>x.n).sort((a,b)=>a-b);
   const selectedFailing=rankedNumbers.filter(x=>!comingPool.has(x.n)&&x.value<Math.min(0.25,scoreMean-scoreSpread)-1e-9).sort((a,b)=>a.value-b.value||a.n-b.n).map(x=>x.n).sort((a,b)=>a-b);
   const meanSelection=(ns,fail)=>ns.length?ns.reduce((v,n)=>v+(fail?1-crossValue(n):crossValue(n)),0)/ns.length:null;
   bestPattern={name:bestCombination.rows+' linhas · '+bestCombination.cols+' colunas · '+bestCombination.odds+' ímpares / '+(cfg()[3]-bestCombination.odds)+' pares',count:cfg()[3],coming:selectedComing,failing:selectedFailing,p:(bestCombination.occurrences+1)/(w+2),occurrences:bestCombination.occurrences,delay:w-1-bestCombination.last,unseen:false,meanComing:meanSelection(selectedComing,false),meanFailing:meanSelection(selectedFailing,true),rowIds:chosen.rowIds,colIds:chosen.colIds};
  }
  panel.innerHTML='<h2>Padrões · '+cfg()[1]+'</h2><p>Base '+base+' → análise para o concurso <strong>'+(base+1)+'</strong> · '+w+' concursos</p><p class="note">Ocorrer significa sair exatamente a quantidade indicada dentro do padrão. Não ocorrer é qualquer outra quantidade. Estimativas ponderadas por recência e referência combinatória; padrões diferentes podem ter probabilidades iguais quando os dados sustentam isso. Uma única indicação dominante por linha ou coluna, sem garantia de resultado.</p><details open><summary>Melhores para o padrão ocorrer</summary>'+'<div class="pattern-grid">'+bestComing.map(card).join('')+'</div>'+'</details><details><summary>Melhores para o padrão não ocorrer</summary>'+'<div class="pattern-grid">'+bestFailing.map(card).join('')+'</div>'+'</details><details open><summary>Padrões mais atrasados</summary>'+'<div class="pattern-grid">'+delayed.map(card).join('')+'</div>'+'</details><button type="button" id="otherPatternModes">Outras análises: linhas, colunas, pares e ímpares</button>';
  if(bestPattern){
   const bestBox=document.createElement('section');bestBox.className='best-pattern-panel';
   const selectedRows=new Set(bestPattern.coming.map(n=>Math.floor((n-offset)/width)+1)),selectedCols=new Set(bestPattern.coming.map(n=>(n-offset)%width+1)),selectedOdds=bestPattern.coming.filter(n=>n%2!==0).length;
   const selectedHeading=bestPattern.coming.length?selectedRows.size+' linhas · '+selectedCols.size+' colunas · '+selectedOdds+' ímpares / '+(bestPattern.coming.length-selectedOdds)+' pares · '+bestPattern.coming.length+' dezenas para sair':'Nenhuma indicação forte para sair';
   bestBox.innerHTML='<div class="best-pattern-heading">★ MELHOR PADRÃO · CONCURSO '+(base+1)+'</div><article class="pattern-item"><strong>'+selectedHeading+'</strong><p>Para fixar/sair ('+bestPattern.coming.length+'):</p><div class="pattern-balls">'+balls(bestPattern.coming,'coming')+'</div><p>Para falhar ('+bestPattern.failing.length+'):</p><div class="pattern-balls">'+balls(bestPattern.failing,'failing')+'</div></article><div class="pattern-rates"><span>Média para fixar/sair: '+(bestPattern.meanComing===null?'Sem indicação forte':pct(bestPattern.meanComing))+'</span><span>Média para falhar: '+(bestPattern.meanFailing===null?'Sem indicação forte':pct(bestPattern.meanFailing))+'</span></div>';
   panel.querySelector('details').before(bestBox);
  }
  updatePatternChecks();$('otherPatternModes').onclick=()=>traditionalModes();panel.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){if(run===patternsRun)panel.innerHTML='<h2>Padrões</h2><p>'+e.message+'</p>';}
}
const traditionalModes=$('modeTrigger').onclick;
$('modeTrigger').textContent='Padrões ▾';
$('modeTrigger').onclick=()=>traditionalModes();
const traditionalModeFields=modeFields;
modeFields=function(){traditionalModeFields();if($('mode').value==='patterns'){$('rows').disabled=true;$('cols').disabled=true;$('modeTrigger').textContent='Padrões ▾';$('msg').textContent='Padrões atrasados: analisa do concurso-base para trás para estimar o próximo.';}else{document.body.classList.remove('patterns-only');$('patternsPanel').classList.add('hidden');patternsRun++;}};
const traditionalCalculate=$('calc').onclick;
$('calc').onclick=async()=>{if($('mode').value==='patterns')return analyzePatterns();return traditionalCalculate()};
const traditionalChoose=choose;
choose=function(i){if(!$('foldView').classList.contains('hidden'))return;patternsRun++;document.body.classList.remove('patterns-only');$('patternsPanel').classList.add('hidden');traditionalChoose(i)};

// V111: conferir padrões preservando a seleção original.
function updatePatternChecks(){
 const panel=$('patternsPanel'),id=+$('base').value;
 const draw=history().find(d=>d.id===id),checking=draw&&id>Number(panel.dataset.base)&&panel.dataset.lottery===key();
 const drawn=new Set(draw?.n||[]);
 panel.querySelectorAll('[data-pattern-number]').forEach(ball=>{
  ball.classList.remove('pattern-hit','pattern-miss','pattern-muted');ball.querySelector('.pattern-check')?.remove();
  ball.removeAttribute('title');
  if(!checking)return;
  const came=drawn.has(Number(ball.dataset.patternNumber));
  const matched=ball.dataset.intent==='coming'?came:!came;
  if(matched)ball.classList.add(ball.dataset.intent==='coming'?'pattern-hit':'pattern-miss');
  const correct=ball.dataset.intent==='coming'?came:!came;
  ball.title=(came?'Saiu':'Falhou')+' no concurso '+id+' · '+(correct?'previsão acertou':'previsão não acertou');
  const mark=document.createElement('i');mark.className='pattern-check';mark.textContent='✓';if(matched)ball.appendChild(mark);
 });
 let legend=panel.querySelector('.pattern-check-legend');
 if(!legend){legend=document.createElement('p');legend.className='pattern-check-legend';panel.querySelector('h2')?.after(legend);}
 legend.innerHTML='<span class="pattern-key"><i class="key-fail"></i> Falhar</span><span class="pattern-key"><i class="key-coming"></i> Sair</span><small>'+(checking?'Concurso '+id+' · Verde ✓: acertou para sair · Vermelho ✓: acertou para falhar · Branca: indicação não acertou.':'Avance o concurso para conferir. A seleção permanece.')+'</small>';
}
const renderBeforePatternChecks=render;
render=function(){renderBeforePatternChecks();updatePatternChecks()};
$('gridtitle').closest('.card').classList.add('traditional-grid-card');

// V127: espera visual de 1,5 segundo antes de calcular.
let calculationAnimationSerial=0;
async function waitCalculationAnimation(){
 const ticket=++calculationAnimationSerial,lotteryKey=key(),base=+$('base').value,button=$('calc');
 button.classList.add('calculation-spinning');button.disabled=true;
 await new Promise(resolve=>setTimeout(resolve,1500));
 if(ticket!==calculationAnimationSerial)return false;
 button.classList.remove('calculation-spinning');button.disabled=false;
 return lotteryKey===key()&&base===+$('base').value;
}
const analyzePatternsBeforeAnimation=analyzePatterns;
analyzePatterns=async function(){
 patternsRun++;$('patternsPanel').classList.add('hidden');
 if(!await waitCalculationAnimation())return;
 return analyzePatternsBeforeAnimation();
};
const calculateBeforeAnimation=$('calc').onclick;
$('calc').onclick=async function(){
 if($('mode').value==='patterns')return analyzePatterns();
 if(!await waitCalculationAnimation())return;
 return calculateBeforeAnimation();
};
